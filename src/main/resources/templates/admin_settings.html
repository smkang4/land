<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/head :: headFragment('관리자 설정', null)}"></th:block>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <style>

        @charset "UTF-8";
        html, body {
            font-family: 'Spoqa Han Sans Neo', 'sans-serif';
            background: var(--paper, #eef1f6);
            min-height: 100vh;
            height: 100%;
        }
        .container-fluid {
            height: 90%;
        }
        .main-content {
            padding: 20px;
        }
        .filter-section {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: 0 1px 2px rgba(15,23,42,0.04); border: 1px solid var(--line, #e2e8f0);
        }
        .action-buttons {
            margin-bottom: 20px;
        }
        .btn-action {
            margin-right: 10px;
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 1px 2px rgba(15,23,42,0.04); border: 1px solid var(--line, #e2e8f0);
        }
        .btn-add {
            background-color: #2ecc71;
            border-color: #2ecc71;
            color: white;
        }
        .btn-add:hover {
            background-color: #27ae60;
            border-color: #27ae60;
            color: white;
        }
        .btn-delete {
            background-color: #e74c3c;
            border-color: #e74c3c;
            color: white;
        }
        .btn-delete:hover {
            background-color: #c0392b;
            border-color: #c0392b;
            color: white;
        }
        .modal-content {
            border-radius: 14px;
        }
        .modal-header {
            background-color: #f8f9fa;
            border-radius: 15px 15px 0 0;
        }
        .modal-footer {
            background-color: #f8f9fa;
            border-radius: 0 0 15px 15px;
        }
        .table-container {
            background: white;
            border-radius: 14px;
            box-shadow: 0 1px 2px rgba(15,23,42,0.04); border: 1px solid var(--line, #e2e8f0);
            padding: 20px;
            margin-bottom: 20px;
        }
        .table {
            margin-bottom: 0;
        }
        .table thead th {
            background-color: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
            font-weight: 600;
            color: #495057;
        }
        .table tbody tr {
            cursor: pointer;
        }
        .table tbody tr:hover {
            background-color: #f8f9fa;
        }
        .table tbody td:first-child {
            padding: 0;
        }
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            cursor: pointer;
        }
        .checkbox-wrapper:hover {
            background-color: rgba(0,0,0,0.05);
            border-radius: 4px;
        }
        .form-check-input {
            cursor: pointer;
            width: 18px;
            height: 18px;
            margin: 0;
        }
        .form-check-input:checked {
            background-color: #2ecc71;
            border-color: #2ecc71;
        }
    
    </style>
</head>
<body class="app-shell--quiet">

<th:block th:with="backUrl=@{/admin}, backText='관리자'">
    <div th:replace="~{fragments/header :: siteHeader}"></div>
</th:block>

<main>
    <div class="container-fluid">
        <div class="row mb-4">
            <div class="col-12">
                <h2 class="mb-4">관리자 설정</h2>
            </div>
        </div>

        <!-- 액션 버튼 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="action-buttons">
                    <button type="button" class="btn btn-action btn-add" onclick="openAddAdminModal()">
                        <i class="bi bi-person-plus"></i> 관리자 추가
                    </button>
                    <button type="button" class="btn btn-action btn-delete" onclick="deleteSelectedAdmins()">
                        <i class="bi bi-person-dash"></i> 선택 삭제
                    </button>
                </div>
            </div>
        </div>

        <!-- 관리자 목록 테이블 -->
        <div class="row">
            <div class="col-12">
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th style="width: 50px;">
                                    <div class="checkbox-wrapper">
                                        <input type="checkbox" class="form-check-input" id="selectAll">
                                    </div>
                                </th>
                                <th style="width: 100px;">사번</th>
                                <th>이름</th>
                            </tr>
                        </thead>
                        <tbody id="adminTableBody">
                            <!-- 데이터가 여기에 동적으로 추가됩니다 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- 관리자 추가 모달 -->
<div class="modal fade" id="addAdminModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">관리자 추가</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addAdminForm">
                    <div class="mb-3">
                        <label class="form-label">사용자 선택</label>
                        <select class="form-select select2" id="userSelect" name="empNo" required>
                            <option value="">사용자를 선택하세요</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" class="btn btn-primary" onclick="addAdmin()">추가</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script src="js/common.js" th:src="@{/js/common.js}"></script>

<script th:inline="javascript">
    // Select2 초기화
    $(document).ready(function() {
        loadAdminList();
        
        // 전체 선택 체크박스 이벤트
        $('#selectAll').on('click', function(e) {
            e.stopPropagation();
            $('.admin-checkbox').prop('checked', $(this).prop('checked'));
        });

        // 테이블 헤더 클릭 이벤트 방지
        $('.table thead').on('click', function(e) {
            e.stopPropagation();
        });
    });

    // 관리자 목록 조회
    function loadAdminList() {
        $.ajax({
            url: '/api/admin/list',
            method: 'GET',
            success: function(response) {
                const tbody = $('#adminTableBody');
                tbody.empty();
                
                response.data.forEach(admin => {
                    tbody.append(`
                        <tr data-emp-no="${admin.empNo}">
                            <td>
                                <div class="checkbox-wrapper">
                                    <input type="checkbox" class="form-check-input admin-checkbox" value="${admin.empNo}">
                                </div>
                            </td>
                            <td>${admin.empNo}</td>
                            <td>${admin.userName}</td>
                        </tr>
                    `);
                });

                // 체크박스 이벤트 리스너 추가
                $('.admin-checkbox').on('click', function(e) {
                    e.stopPropagation();
                    const allChecked = $('.admin-checkbox:checked').length === $('.admin-checkbox').length;
                    $('#selectAll').prop('checked', allChecked);
                });

                // 행 클릭 이벤트
                $('.table tbody tr').on('click', function(e) {
                    if (!$(e.target).is('.checkbox-wrapper, .form-check-input')) {
                        const checkbox = $(this).find('.admin-checkbox');
                        checkbox.prop('checked', !checkbox.prop('checked'));
                        const allChecked = $('.admin-checkbox:checked').length === $('.admin-checkbox').length;
                        $('#selectAll').prop('checked', allChecked);
                    }
                });
            },
            error: function(xhr, status, error) {
                console.error('관리자 목록 조회 실패:', error);
                alert('관리자 목록을 불러오는데 실패했습니다.');
            }
        });
    }

    // 사용자 목록 조회
    function loadUserList() {
        $.ajax({
            url: '/api/admin/users',
            method: 'GET',
            success: function(response) {
                const select = $('#userSelect');
                select.empty();
                select.append('<option value="">사용자를 선택하세요</option>');
                
                response.data.forEach(user => {
                    select.append(`<option value="${user.empNo}">${user.userName} (${user.positionName} - ${user.deptName})</option>`);
                });

                select.select2({
                    theme: 'bootstrap-5',
                    width: '100%'
                });
            },
            error: function(xhr, status, error) {
                console.error('사용자 목록 조회 실패:', error);
                alert('사용자 목록을 불러오는데 실패했습니다.');
            }
        });
    }

    // 관리자 추가 모달 열기
    function openAddAdminModal() {
        $('#addAdminForm')[0].reset();
        loadUserList();
        new bootstrap.Modal(document.getElementById('addAdminModal')).show();
    }

    // 관리자 추가
    function addAdmin() {
        const empNo = $('#userSelect').val();
        if (!empNo) {
            alert('사용자를 선택해주세요.');
            return;
        }

        const selectedOption = $('#userSelect option:selected');
        const userName = selectedOption.text().split(' (')[0];

        $.ajax({
            url: '/api/admin/add',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ 
                empNo: empNo,
                userName: userName
            }),
            success: function(response) {
                alert('관리자가 추가되었습니다.');
                $('#addAdminModal').modal('hide');
                loadAdminList();
            },
            error: function(xhr, status, error) {
                console.error('관리자 추가 실패:', error);
                alert('관리자 추가에 실패했습니다.');
            }
        });
    }

    // 선택된 관리자 삭제
    function deleteSelectedAdmins() {
        const selectedEmpNos = $('.admin-checkbox:checked').map(function() {
            return $(this).val();
        }).get();

        if (selectedEmpNos.length === 0) {
            alert('삭제할 관리자를 선택해주세요.');
            return;
        }

        if (!confirm('선택한 관리자를 삭제하시겠습니까?')) {
            return;
        }

        $.ajax({
            url: '/api/admin/delete',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ empNos: selectedEmpNos }),
            success: function(response) {
                alert('선택한 관리자가 삭제되었습니다.');
                loadAdminList();
            },
            error: function(xhr, status, error) {
                console.error('관리자 삭제 실패:', error);
                alert('관리자 삭제에 실패했습니다.');
            }
        });
    }
</script>
</body>
</html>
