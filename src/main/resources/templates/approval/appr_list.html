<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/spoqa-han-sans@2.1.2/css/SpoqaHanSansNeo.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/checkbox.css}">
    <link rel="stylesheet" th:href="@{/css/grid.css}">

    <!-- Select2   -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" />

    <!-- Toast Grid-->
    <link rel="stylesheet" href="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css" />
    <link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
    <style>
        @charset "UTF-8";
        .container-fluid {
          height: 92%;
        }

        .search-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
        }

        .search-toolbar__proj {
            flex: 0 0 50%;
            width: 50%;
            max-width: 50%;
            min-width: 0;
        }

        .appr-conf-tag-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
            flex: 0 0 auto;
        }

        .appr-conf-tag-group .btn {
            min-width: 3.5rem;
            font-size: 0.8125rem;
        }

        .appr-conf-tag-group .btn.active {
            pointer-events: none;
        }

        /* Responsive Design for Mobile */
        @media (max-width: 768px) {
            .container-fluid {
                padding: 0.5rem;
                height: auto;
            }

            /* Header Responsive */
            .header-content {
                flex-direction: column;
                gap: 0.75rem;
                padding: 0.75rem;
                text-align: center;
            }

            .logo-container {
                flex-direction: column;
                text-align: center;
                gap: 0.5rem;
            }

            .logo {
                max-width: 120px;
            }

            .header-title {
                font-size: 1rem;
                font-weight: 600;
            }

            .user-info {
                flex-direction: column;
                gap: 0.5rem;
                align-items: center;
                width: 100%;
            }

            .user-name {
                font-size: 0.9rem;
                margin: 0;
                padding: 0.25rem 0;
                white-space: nowrap;
            }

            /* 사용자 정보를 가로로 배치하는 컨테이너 */
            .user-info .user-details {
                display: flex;
                flex-direction: row;
                gap: 0.5rem;
                align-items: center;
                justify-content: center;
                flex-wrap: wrap;
            }

            /* 버튼들을 별도 컨테이너로 분리 */
            .user-info .button-container {
                display: flex;
                flex-direction: column;
                gap: 0.25rem;
                width: 100%;
                align-items: center;
            }

            .btn-back,
            .btn-action {
                width: 100%;
                margin: 0.25rem 0;
            }

            /* Ensure form buttons also get full width */
            .user-info form {
                width: 100%;
            }

            .user-info form button {
                width: 100%;
                margin: 0.25rem 0;
            }

            /* Search Form Responsive */
            .bg-style-search {
                padding: 0.75rem;
                border-radius: 8px;
            }

            .bg-style-search .row {
                margin: 0;
            }

            .search-toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .search-toolbar__proj {
                width: 100%;
                min-width: 0;
            }

            .appr-conf-tag-group {
                width: 100%;
            }

            .appr-conf-tag-group .btn {
                flex: 1 1 calc(50% - 0.35rem);
            }

            .search-toolbar #searchBtn {
                width: 100%;
            }

            .bg-style-search .col-auto {
                width: 100%;
                text-align: center;
            }

            .bg-style-search .btn {
                width: 100%;
                margin-top: 0.5rem;
            }

            /* Button Responsive */
            .btn-conf {
                width: 100%;
                margin-bottom: 0.5rem;
            }

            /* Grid Responsive */
            #grid {
                height: calc(100vh - 400px) !important;
                font-size: 0.8rem;
            }

            /* Modal Responsive */
            .modal-dialog {
                margin: 0.5rem;
                max-width: calc(100% - 1rem);
            }

            .modal-content {
                border-radius: 8px;
            }

            .modal-header,
            .modal-body,
            .modal-footer {
                padding: 1rem;
            }

            /* Table/Grid Column Adjustments */
            .tui-grid-container {
                font-size: 0.75rem;
            }

            .tui-grid-cell {
                padding: 0.25rem;
            }

            /* Hide less important columns on mobile */
            .tui-grid-cell[data-column-name="proj_code"],
            .tui-grid-cell[data-column-name="next_appr_emp_nm"],
            .tui-grid-cell[data-column-name="last_appr_emp_nm"] {
                display: none;
            }

            /* Adjust column widths for mobile */
            .tui-grid-cell[data-column-name="proj_name"] {
                min-width: 120px;
            }

            .tui-grid-cell[data-column-name="address"] {
                min-width: 150px;
            }

            .tui-grid-cell[data-column-name="first_appr_emp_nm"] {
                min-width: 80px;
            }

            .tui-grid-cell[data-column-name="first_appr_date"] {
                min-width: 90px;
            }

            .tui-grid-cell[data-column-name="last_appr_date"] {
                min-width: 90px;
            }
        }

        /* Tablet Responsive */
        @media (min-width: 769px) and (max-width: 1024px) {
            .container-fluid {
                padding: 1rem;
            }

            #grid {
                height: calc(100vh - 350px) !important;
            }

            .bg-style-search .col-sm-5 {
                margin-bottom: 0.5rem;
            }
        }

        /* General Mobile Improvements */
        @media (max-width: 576px) {
            h3 {
                font-size: 1.5rem;
                margin-bottom: 0.5rem;
            }

            .row.mb-4 span {
                font-size: 0.9rem;
                line-height: 1.4;
            }

            .form-select,
            .form-control {
                font-size: 0.9rem;
            }

            .btn {
                font-size: 0.9rem;
                padding: 0.5rem 1rem;
            }

            /* Improve touch targets */
            .tui-grid-cell {
                min-height: 44px;
                display: flex;
                align-items: center;
            }

            /* Better spacing for mobile */
            .row.mb-2,
            .row.mb-1 {
                margin-bottom: 0.75rem !important;
            }
        }

        /* Landscape orientation adjustments */
        @media (max-width: 768px) and (orientation: landscape) {
            .header-content {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                padding: 0.5rem;
                gap: 1rem;
            }

            .logo-container {
                flex-direction: row;
                align-items: center;
                gap: 0.5rem;
                flex: 1;
            }

            .logo {
                max-width: 80px;
            }

            .header-title {
                font-size: 0.9rem;
            }

            .user-info {
                flex-direction: row;
                align-items: center;
                gap: 0.5rem;
                flex-wrap: wrap;
                justify-content: flex-end;
            }

            .user-name {
                font-size: 0.8rem;
                margin: 0;
            }

            .btn-back,
            .btn-action {
                width: auto;
                max-width: none;
                margin: 0;
                font-size: 0.8rem;
                padding: 0.4rem 0.8rem;
            }

            #grid {
                height: calc(100vh - 200px) !important;
            }
        }
    </style>
</head>


<body>
<header class="main-header">
    <div class="header-content">
        <div class="logo-container">
            <img src="/images/dongah.gif" alt="로고" class="logo">
            <span class="header-title">부동산 임차관리 플랫폼</span>
        </div>
        <div class="user-info">
            <div class="user-details">
                <span class="user-name" th:text="${#authentication.principal.deptName}"></span>
                <span class="user-name" th:text="${#authentication.principal.userName + #authentication.principal.positionName}"></span>
            </div>
            <div class="button-container">
                <a href="/" class="btn btn-back">
                    <i class="bi bi-arrow-left"></i> 메인화면
                </a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-action">로그아웃</button>
                </form>
            </div>
        </div>
    </div>
</header>

<main>

    <div class="container-fluid">
        <div class="row mb-4">
            <h3>결재함</h3>
            <span>본인에게 들어온 사전조사서를 조회하여 확인처리를 할 수 있습니다</span>
        </div>


        <div class="row mb-2">

            <div class="col col-12 col-sm-12">
                <form id="search_form" method="get">

                    <div class="row mb-1 bg-style-search">
                        <div class="col-12">
                            <div class="search-toolbar">
                                <div class="search-toolbar__proj">
                                    <select id="sel_proj" name="proj_code" class="form-select form-select-sm" style="width:100%"></select>
                                </div>
                                <input type="hidden" id="sel_conf_tag" name="conf_tag" value="2">
                                <div class="appr-conf-tag-group" id="conf_tag_buttons" role="group" aria-label="결재 상태">
                                    <button type="button" class="btn btn-sm btn-outline-primary conf-tag-btn active" data-conf-tag="2">대기</button>
                                    <button type="button" class="btn btn-sm btn-outline-primary conf-tag-btn" data-conf-tag="5">진행</button>
                                    <button type="button" class="btn btn-sm btn-outline-primary conf-tag-btn" data-conf-tag="3">완료</button>
                                    <button type="button" class="btn btn-sm btn-outline-primary conf-tag-btn" data-conf-tag="4">반려</button>
                                </div>
                                <button type="button" class="btn btn-sm btn-danger btn_s" id="searchBtn"><i class="bi bi-search"></i> 조회</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="row mb-1">
            <div class="col col-12">
                <button class="btn btn-sm btn-primary btn-conf" id="btnSelectConfirm"><i class="bi bi-collection"></i> 확인처리(선택)</button>
<!--                <button class="btn btn-sm btn-danger" id="btnStatDelete"><i class="bi bi-trash"></i> 삭제(선택)</button>-->
            </div>
        </div>
        <div class="row" style="height: calc(100vh - 250px);">
            <div class="col col-12" id="grid" style="height: 100%; min-height: 300px;"></div>
        </div>
    </div>
    <!-- 결재라인 Modal -->
    <div id="remark_popup" class="modal fade" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" role="dialog" >
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content rounded-3 shadow">
                <div class="modal-header p-4 text-center">
                    <h5>확인처리-의견(필수입력)</h5>
                </div>
                <div class="modal-body p-4 text-center">
                    <textarea class="form-control" placeholder="Comments" id="txtApprRemarks" style="height: 100px"></textarea>
                </div>

                <div class="modal-footer flex-nowrap p-0" id="">
                    <button type="button" id="appr_confirm_yes" class="btn btn-lg btn-link fs-6 text-decoration-none col-6 py-3 m-0 rounded-0 border-end" data-bs-dismiss=""><strong>확인</strong></button>
                    <button type="button" id="appr_confirm_no" class="btn btn-lg btn-link fs-6 text-decoration-none col-6 py-3 m-0 rounded-0" data-bs-dismiss="">취소</button>
                </div>

            </div>
        </div>
    </div>

</main>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <script src="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.js"></script>
    <script src="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.js"></script>

    <script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
    <script src="js/grid_custom.js" th:src="@{/js/grid_custom.js}"></script>
    <!-- Custom   -->
    <script src="js/common.js?v=1.0.3" th:src="@{/js/common.js?v=1.0.3}"></script>

    <script th:inline="javascript">

        var user_no = [[${#authentication.principal.userNo}]];
        var dept_code = [[${#authentication.principal.deptCode}]];
        var proj_url = '/api/code/proj/'+user_no;

        ufn_select2_getData(proj_url,"#sel_proj","현장","",function(){});
        ufn_select2_getData_modal('/api/code/proj/user',"#sel_confirm_user","현장소장/대리인","",function(){});

       const grid = new Grid({
         el: document.getElementById('grid'), // Container element
         //data: dataSource,
         bodyHeight: 'fitToParent',
         rowHeight: 50,
         rowHeaders: [
           { type: 'rowNum', width: 30, align: 'center', valign: 'middle' },
           {
               type: 'checkbox',
               header:
               `<label for="all-checkbox" class="checkbox">
               <input type="checkbox" id="all-checkbox" class="hidden-input" name="_checked" />
               <span class="custom-input"></span>
               </label>` ,
               renderer: {
                   type: CheckboxRenderer
               }
           }
         ],
         header:{
             height: 50,
             complexColumns: [
             {
               header: '고용허가기간',
               name: 'mergeColumn1',
               childNames: ['goyong_date1', 'goyong_date2']
             }
           ]
         },
         hideLoadingBar: false,
         pageOptions: {
           useClient: true,
           type: 'scroll',
           perPage: -1
         },
         columns: [
           { header: '계약seq',name: 'd_seq',width: 70, align: 'center',sortable: true ,hidden: true},
           { header: '결재순번',name: 'appr_num',width: 70, align: 'center',sortable: true ,hidden: true},
           { header: '결재번호',name: 'appr_no',width: 70, align: 'center',sortable: true ,hidden: true},
           { header: '결재자',name: 'appr_emp_no',width: 70, align: 'center',sortable: true ,hidden: true},
          { header: '구분',name: 'view_role',width: 55, align: 'center', sortable: true
              ,formatter: function(e) {
                  return formatViewRole(e.value);
              }
          },
          { header: '확인상태',name: 'appr_stat',width: 90, align: 'center',sortable: true ,hidden: false
              ,formatter: function (e) {
                  var row = grid.getRow(e.rowKey);
                  return formatApprStat(row);
              }
          },
           { header: '확인',name: 'confirm',width: 70, align: 'center',sortable: false, hidden: false
               ,formatter:function(e){
                   return '<button class="btn btn-sm btn-warning"><i class="bi bi-file-text"></i></button>'
               }
           },

           { header: '현장코드',name: 'proj_code',sortable: true, filter: 'text' , hidden: true},
           { header: '현장명',name: 'proj_name',width: 300, sortable: true, filter:{type:'text'}},

           { header: '현장숙소 주소',name: 'address',width: 500, sortable: true, filter:{type:'text'}
               ,formatter:function(e){
                   return '<a href="#">'+e.value+'</a>'
               }
           },

           { header: '요청자',name: 'first_appr_emp_nm',width: 100, align: 'center', sortable: true},
           { header: '요청일',name: 'first_appr_date',width: 100, align: 'center', sortable: true
               ,formatter: function (e) {
                   return toStringByFormatting(e.value)
               }
           },

           { header: '다음확인자',name: 'next_appr_emp_nm',width: 100, align: 'center', sortable: true},

           { header: '최종확인자',name: 'last_appr_emp_nm',width: 100, align: 'center', sortable: true},
           { header: '최종확인일',name: 'last_appr_date',width: 100, align: 'center', sortable: true
               ,formatter: function (e) {
                   return toStringByFormatting(e.value)
               }
           },
         ],
         columnOptions: {
           resizable: true
         }
       });

       grid.on('click',(ev)=>{
           if (ev.targetType === 'cell' && ev.columnName === 'address') {
               const rowIndex = ev.rowKey;
               const row = grid.getRow(rowIndex);

               openMap(row.address);
           }

           if (ev.targetType === 'cell' && ev.columnName === 'detail') {
               const rowIndex = ev.rowKey;
               const row = grid.getRow(rowIndex);

               openDetail(row.seq);
           }

           if (ev.targetType === 'cell' && ev.columnName === 'confirm') {
               const row = grid.getRow(ev.rowKey);
               openApproval(row.appr_no);
           }

           if (ev.targetType === 'cell' && ev.columnName === 'docu_file') {
               const rowIndex = ev.rowKey;
               const row = grid.getRow(rowIndex);
               if(row.fn_tg == 'F'){
                   return false;
               }else{
                   btnDocContractDown(row.seq);
               }
           }
       });

       grid.on('dblclick', (ev) => {
           //console.log(ev.rowKey+"//"+ev.columnName);
           //var vData = grid.getValue(ev.rowKey, ev.columnName);
           //console.log(vData);
       });

       grid.on('check', (ev) => {
         var appr_stat = grid.getValue(ev.rowKey, "appr_stat");

         if(appr_stat == '3' || appr_stat == '4' ){
           MsgBox.Alert("*확인완료 또는 반려 처리된 문서는 선택이 불가능 합니다.");
           grid.uncheck(ev.rowKey);
         }
       });

       grid.on('checkAll', () => {
           var checkedRows = grid.getCheckedRows();
           checkedRows.forEach((row, index) => {
              if(row.appr_stat == '3' || row.appr_stat == '4' ){
                   grid.uncheck(row.rowKey);
              }
           });
       });

       grid.on('onGridUpdated', (ev) => {

    console.log("onGridUpdate");
    if (grid.getData().length > 0) {
        //grid.focus(0);
        //grid.setSelectionRange({ start: [0, 0], end: [0, grid.getColumns().length - 1] });
    }

    grid.getData().forEach(row => {

        if(row.conf_stat == "4"){
            grid.addCellClassName(row.rowKey, 'conf_stat', 'text-danger');
        }else if(row.conf_stat == "1"){
            grid.addCellClassName(row.rowKey, 'conf_stat', 'text-dark');
        }else if(row.conf_stat == "2"){
            grid.addCellClassName(row.rowKey, 'conf_stat', 'text-primary');
        }else if(row.conf_stat == "3"){
            grid.addCellClassName(row.rowKey, 'conf_stat', 'text-success');
        }else if(row.conf_stat == "0"){
            grid.addCellClassName(row.rowKey, 'conf_stat', 'text-secondary');
        }

        if(row.cont_stat == "C"){
            grid.addCellClassName(row.rowKey, 'cont_stat_nm', 'text-danger');
        }else if(row.cont_stat == "A"){
            grid.addCellClassName(row.rowKey, 'cont_stat_nm', 'text-success');
        }
    });
});


        grid.on('onGridUpdated', (ev) => {

            console.log("onGridUpdate: "+grid.getData().length );
            if (grid.getData().length > 0) {
                //grid.focus(0);
                //grid.setSelectionRange({ start: [0, 0], end: [0, grid.getColumns().length - 1] });
            }

            grid.getData().forEach(row => {

            });
        });


       function getConfTag() {
           return $("#sel_conf_tag").val();
       }

       function setConfTag(confTag) {
           $("#sel_conf_tag").val(confTag);
           $(".conf-tag-btn").removeClass("active");
           $('.conf-tag-btn[data-conf-tag="' + confTag + '"]').addClass("active");
           updateConfTagUi(confTag);
       }

       function updateConfTagUi(confTag) {
           if (confTag === "2") {
               grid.showColumn('_checked');
               $("#btnSelectConfirm").show();
           } else {
               grid.hideColumn('_checked');
               $("#btnSelectConfirm").hide();
           }
       }

       function loadApprovalList() {
           updateConfTagUi(getConfTag());
           G_load(grid, "/appr/list", "search_form");
       }

       $(".conf-tag-btn").on("click", function() {
           var confTag = $(this).data("conf-tag");
           if (String(confTag) === getConfTag()) {
               return;
           }
           setConfTag(String(confTag));
           loadApprovalList();
       });

       $("#searchBtn").on("click", function() {
           loadApprovalList();
       });


       function openMap(searchTxt){
           var options = "toolbar=no,scrollbars=no,resizable=yes,status=no,menubar=no,width=1200, height=900, top=10,left=100";
           window.open("https://map.naver.com/p/search/"+searchTxt, 'docu',options);
       }

       function openDetail(seq){
           var options = "toolbar=no,scrollbars=no,resizable=yes,status=no,menubar=no,width=1200, height=900, top=10,left=100";
           window.open("/detail?seq="+seq, 'docu',options);
       }

       function openApproval(appr_no){

           var options = "toolbar=no,scrollbars=no,resizable=yes,status=no,menubar=no,width=1200, height=900, top=10,left=100";
           window.open("/appr/reg/"+appr_no,"approval", options);

       }

       $("#btnSelectConfirm").on("click",function(){
           $(".btn-conf").prop("disabled",true);
           var grdData = grid.getCheckedRows();

           if(grdData.length == 0){
               MsgBox.Alert("*선택된 행(row)이 없습니다.");
               $(".btn-conf").prop("disabled",false);
               return false;
           }
           var approverRows = grdData.filter(function(r) { return !isCcViewerRow(r); });
           if (approverRows.length === 0) {
               MsgBox.Alert("*참조 건은 일괄 확인할 수 없습니다.");
               $(".btn-conf").prop("disabled",false);
               return false;
           }
           if (approverRows.length < grdData.length) {
               MsgBox.Alert("*참조 건은 제외하고 결재자 건만 일괄 확인합니다.");
           }
           grid.uncheckAll();
           approverRows.forEach(function(r) { grid.check(r.rowKey); });
           $("#txtApprRemarks").val("");
           $("#remark_popup").modal("show");
       });

        var apprTotalCount = 0;
        var apprCompletedCount = 0;
        var apprReloadFlag = false; // 중복 실행 방지 플래그

        $("#appr_confirm_yes").on("click",function(){
           var grdData = grid.getCheckedRows();
           var appr_remarks = $("#txtApprRemarks").val();
           
           // 카운터 초기화
           apprTotalCount = grdData.length;
           apprCompletedCount = 0;
           apprReloadFlag = false;

           for(var i = 0 ; i <= grdData.length-1 ; i++){
                if (isCcViewerRow(grdData[i])) { continue; }
                btnConfirmApply(grdData[i].d_seq,grdData[i].appr_no,grdData[i].appr_num,grdData[i].appr_emp_no);
           }

           $("#remark_popup").modal("hide");

       });

       $("#appr_confirm_no").on("click",function(){
          $("#remark_popup").modal("hide");
          $(".btn-conf").prop("disabled",false);
       });

       function btnConfirmApply(d_seq,appr_no,appr_num,appr_emp_no){
           var params = "";
           params += "gubun=T";
           params += "&appr_d_seq="+d_seq;
           params += "&appr_emp_no="+appr_emp_no;
           params += "&appr_no="+appr_no;
           params += "&appr_num="+appr_num;
           params += "&next_emp_user=";
           params += "&banRemark="+encodeURIComponent($("#txtApprRemarks").val());

           var vUrl = "/appr/update/detail";
           ufn_transaction(
               vUrl
               ,"POST"
               ,params
               ,"text"
               ,function(){} //before
               ,function(){ //success
                   apprCompletedCount++;
                   
                   if(apprCompletedCount >= apprTotalCount && !apprReloadFlag){
                       apprReloadFlag = true;
                       
                       setTimeout(function() {
                           $(".btn-conf").prop("disabled",false);
                           G_load(grid,"/appr/list","search_form");
                           
                           setTimeout(function() {
                               MsgBox.Alert("*확인완료");
                           }, 500);
                       }, 300);
                   }
               }
               ,function(){ //error
                   apprCompletedCount++;
                   
                   if(apprCompletedCount >= apprTotalCount && !apprReloadFlag){
                       apprReloadFlag = true;
                       
                       setTimeout(function() {
                           $(".btn-conf").prop("disabled",false);
                           G_load(grid,"/appr/list","search_form");
                           
                           setTimeout(function() {
                               MsgBox.Alert("*일부 항목 처리 중 오류가 발생했습니다.");
                           }, 500);
                       }, 300);
                   }
               }, //error
               "" // 성공 메시지
           );
       }

        function init() {
            setConfTag(getConfTag());
            loadApprovalList();
        }

         document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
