<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/spoqa-han-sans@2.1.2/css/SpoqaHanSansNeo.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <title>관리자 대시보드</title>
    <style>
        @charset "UTF-8";
        body {
            font-family: 'Spoqa Han Sans Neo', 'sans-serif';
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        .main-content {
            padding: 20px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        .stat-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .stat-label {
            color: #6c757d;
            font-size: 0.9rem;
        }
        .contract-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: all 0.3s;
            height: 100%;
            cursor: pointer;
        }
        .contract-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        .card-title {
            font-size: 1.1rem;
            line-height: 1.4;
            height: 2.8em;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            margin-bottom: 10px;
        }
        .status-badge {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 500;
            color: white;
        }
        .filter-section {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .admin-header {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .pagination {
            margin-top: 20px;
        }
        .pagination .page-link {
            color: #2c3e50;
            border: none;
            margin: 0 2px;
            border-radius: 5px;
        }
        .pagination .page-item.active .page-link {
            background-color: #2c3e50;
            color: white;
        }
        .btn-admin {
            background: #2c3e50;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            transition: all 0.3s;
        }
        .btn-admin:hover {
            background: #34495e;
            color: white;
        }
        .admin-badge {
            background-color: #2c3e50;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <div class="admin-header d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <img src="/images/dongah.gif" alt="로고" width="40" height="32" class="me-3">
                <h4 class="mb-0">대아건설 임대관리 시스템 <span class="admin-badge">관리자</span></h4>
            </div>
            <div class="d-flex align-items-center">
                <span class="me-3" th:text="${#authentication.principal.userName + '님'}"></span>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-admin">로그아웃</button>
                </form>
            </div>
        </div>

        <!-- 통계 카드 -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-icon text-primary">
                        <i class="bi bi-file-text"></i>
                    </div>
                    <div class="stat-value" id="totalContracts">0</div>
                    <div class="stat-label">전체 계약서</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-icon text-warning">
                        <i class="bi bi-clock"></i>
                    </div>
                    <div class="stat-value" id="pendingContracts">0</div>
                    <div class="stat-label">대기중</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-icon text-success">
                        <i class="bi bi-check-circle"></i>
                    </div>
                    <div class="stat-value" id="approvedContracts">0</div>
                    <div class="stat-label">승인됨</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-icon text-danger">
                        <i class="bi bi-x-circle"></i>
                    </div>
                    <div class="stat-value" id="rejectedContracts">0</div>
                    <div class="stat-label">반려됨</div>
                </div>
            </div>
        </div>

        <!-- 검색 및 필터 -->
        <div class="filter-section">
            <div class="row">
                <div class="col-md-4">
                    <div class="input-group">
                        <input type="text" class="form-control" id="searchInput" placeholder="검색어를 입력하세요">
                        <button class="btn btn-admin" type="button" id="searchBtn">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="statusFilter">
                        <option value="">전체 상태</option>
                        <option value="0">대기중</option>
                        <option value="1">승인됨</option>
                        <option value="2">반려됨</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="sortBy">
                        <option value="latest">최신순</option>
                        <option value="oldest">오래된순</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button class="btn btn-admin w-100" id="exportBtn">
                        <i class="bi bi-download me-1"></i>엑셀 다운로드
                    </button>
                </div>
            </div>
        </div>

        <!-- 계약서 목록 -->
        <div class="row" id="requestList">
            <!-- 카드 목록이 여기에 동적으로 추가됩니다 -->
        </div>

        <!-- 페이지네이션 -->
        <nav aria-label="Page navigation" class="mt-4">
            <ul class="pagination justify-content-center" id="pagination">
                <!-- 페이지네이션이 여기에 동적으로 추가됩니다 -->
            </ul>
        </nav>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 전역 함수로 이동
        function openRequestDetail(seq) {
            window.open(`/api/request-detail?seq=${seq}`, 'requestDetail',
                'width=800,height=600,scrollbars=yes,resizable=yes');
        }

        $(document).ready(function() {
            let currentPage = 1;
            const pageSize = 6;
            let totalPages = 1;

            // 상태별 스타일
            const statusStyles = {
                '0': 'bg-warning',
                '1': 'bg-success',
                '2': 'bg-danger'
            };

            // 상태 텍스트
            const statusText = {
                '0': '대기중',
                '1': '승인됨',
                '2': '반려됨'
            };

            // 통계 업데이트
            function updateStats(contracts) {
                const stats = {
                    total: contracts.length,
                    pending: contracts.filter(c => c.approval === '0').length,
                    approved: contracts.filter(c => c.approval === '1').length,
                    rejected: contracts.filter(c => c.approval === '2').length
                };

                $('#totalContracts').text(stats.total);
                $('#pendingContracts').text(stats.pending);
                $('#approvedContracts').text(stats.approved);
                $('#rejectedContracts').text(stats.rejected);
            }

            // 계약서 목록 로드
            function loadRequests(page = 1, searchKeyword = '', status = '', sortBy = 'latest') {
                $.ajax({
                    url: '/api/admin/contracts',
                    type: 'GET',
                    data: {
                        page: page - 1,
                        size: pageSize,
                        search: searchKeyword,
                        status: status,
                        sortBy: sortBy
                    },
                    success: function(response) {
                        const contracts = response.content;
                        totalPages = response.totalPages;
                        
                        // 통계 업데이트
                        updateStats(contracts);
                        
                        // 카드 목록 초기화
                        $('#requestList').empty();
                        
                        // 카드 생성
                        contracts.forEach(contract => {
                            const card = `
                                <div class="col-md-4 mb-4">
                                    <div class="contract-card" onclick="openRequestDetail(${contract.seq})">
                                        <div class="d-flex justify-content-between align-items-start mb-2">
                                            <h5 class="card-title">${contract.projName}</h5>
                                            <span class="badge ${statusStyles[contract.approval]} status-badge">
                                                ${statusText[contract.approval]}
                                            </span>
                                        </div>
                                        <div class="card-text">
                                            <p class="mb-1"><i class="bi bi-person me-2"></i>${contract.userNm}</p>
                                            <p class="mb-1"><i class="bi bi-calendar me-2"></i>${new Date(contract.crtdate).toLocaleDateString()}</p>
                                            <p class="mb-0"><i class="bi bi-building me-2"></i>${contract.projCode}</p>
                                        </div>
                                    </div>
                                </div>
                            `;
                            $('#requestList').append(card);
                        });

                        // 페이지네이션 업데이트
                        updatePagination(page);
                    },
                    error: function(xhr, status, error) {
                        console.error('Error loading contracts:', error);
                        if (xhr.status === 403) {
                            alert('관리자만 접근할 수 있습니다.');
                            window.location.href = '/main';
                        }
                    }
                });
            }

            // 페이지네이션 업데이트
            function updatePagination(currentPage) {
                $('#pagination').empty();
                
                // 이전 페이지 버튼
                $('#pagination').append(`
                    <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                        <a class="page-link" href="#" data-page="${currentPage - 1}">이전</a>
                    </li>
                `);

                // 페이지 번호
                for (let i = 1; i <= totalPages; i++) {
                    $('#pagination').append(`
                        <li class="page-item ${i === currentPage ? 'active' : ''}">
                            <a class="page-link" href="#" data-page="${i}">${i}</a>
                        </li>
                    `);
                }

                // 다음 페이지 버튼
                $('#pagination').append(`
                    <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                        <a class="page-link" href="#" data-page="${currentPage + 1}">다음</a>
                    </li>
                `);
            }

            // 이벤트 리스너
            $(document).on('click', '.page-link', function(e) {
                e.preventDefault();
                const page = $(this).data('page');
                if (page >= 1 && page <= totalPages) {
                    currentPage = page;
                    loadRequests(currentPage, $('#searchInput').val(), $('#statusFilter').val(), $('#sortBy').val());
                }
            });

            $('#searchBtn').click(function() {
                currentPage = 1;
                loadRequests(currentPage, $('#searchInput').val(), $('#statusFilter').val(), $('#sortBy').val());
            });

            $('#searchInput').keypress(function(e) {
                if (e.which === 13) {
                    currentPage = 1;
                    loadRequests(currentPage, $(this).val(), $('#statusFilter').val(), $('#sortBy').val());
                }
            });

            $('#statusFilter, #sortBy').change(function() {
                currentPage = 1;
                loadRequests(currentPage, $('#searchInput').val(), $('#statusFilter').val(), $('#sortBy').val());
            });

            $('#exportBtn').click(function() {
                // 엑셀 다운로드 기능 구현
                alert('엑셀 다운로드 기능은 준비 중입니다.');
            });

            // 초기 목록 로드
            loadRequests();
        });
    </script>
</body>
</html>
