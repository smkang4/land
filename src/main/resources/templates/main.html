<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/head :: headFragment('부동산 임차관리 플랫폼', null)}"></th:block>
</head>
<body>
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <main class="app-shell app-main">
        <section class="welcome-block">
            <p class="welcome-block__eyebrow">동아지질</p>
            <h1 class="welcome-block__title text-balance">부동산 임차관리 플랫폼</h1>
            <p class="welcome-block__sub">
                <span th:text="${#authentication.principal.userName}">사용자</span> 님, 오늘 처리할 업무를 선택하세요
            </p>
        </section>

        <section class="hub-section">
            <div class="hub-section__label">
                <h2>업무 메뉴</h2>
            </div>
            <div class="hub-grid">
                <a href="/request" class="hub-card">
                    <span class="hub-card__icon" aria-hidden="true"><i class="bi bi-house-door"></i></span>
                    <span class="hub-card__body">
                        <span class="hub-card__title">사전조사서 작성</span>
                        <span class="hub-card__desc">부동산 물건 사전조사서를 작성합니다</span>
                    </span>
                    <i class="bi bi-arrow-right hub-card__chevron" aria-hidden="true"></i>
                </a>
                <a href="/list" class="hub-card">
                    <span class="hub-card__icon" aria-hidden="true"><i class="bi bi-clipboard-check"></i></span>
                    <span class="hub-card__body">
                        <span class="hub-card__title">조사서 확인 및 요청</span>
                        <span class="hub-card__desc">작성 건을 확인하고 결재를 요청합니다</span>
                    </span>
                    <i class="bi bi-arrow-right hub-card__chevron" aria-hidden="true"></i>
                </a>
                <a href="/appr_list" class="hub-card">
                    <span class="hub-card__icon" aria-hidden="true"><i class="bi bi-inbox"></i></span>
                    <span class="hub-card__body">
                        <span class="hub-card__title">결재함</span>
                        <span class="hub-card__desc">대기·진행 중인 결재를 처리합니다</span>
                    </span>
                    <i class="bi bi-arrow-right hub-card__chevron" aria-hidden="true"></i>
                </a>
                <a href="/draft_list" class="hub-card">
                    <span class="hub-card__icon" aria-hidden="true"><i class="bi bi-file-earmark-text"></i></span>
                    <span class="hub-card__body">
                        <span class="hub-card__title">기안서 작성 및 관리</span>
                        <span class="hub-card__desc">임대차 기안서를 작성하고 관리합니다</span>
                    </span>
                    <i class="bi bi-arrow-right hub-card__chevron" aria-hidden="true"></i>
                </a>
            </div>
        </section>

        <section class="hub-section" th:if="${admin == 'Y'}">
            <div class="hub-section__label">
                <h2>관리</h2>
            </div>
            <div class="hub-grid">
                <a href="/admin" class="hub-card">
                    <span class="hub-card__icon" aria-hidden="true"><i class="bi bi-sliders"></i></span>
                    <span class="hub-card__body">
                        <span class="hub-card__title">관리자</span>
                        <span class="hub-card__desc">전체 현황과 설정을 관리합니다</span>
                    </span>
                    <i class="bi bi-arrow-right hub-card__chevron" aria-hidden="true"></i>
                </a>
            </div>
        </section>
    </main>

    <div th:replace="~{fragments/footer.html :: site-footer}"></div>

    <div th:if="${noticeModalEnabled}" class="modal fade" id="noticeModal" tabindex="-1"
         aria-labelledby="noticeModalLabel" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header notice-modal-header">
                    <h5 class="modal-title" id="noticeModalLabel">
                        <i class="bi bi-megaphone me-2"></i>기능 안내
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <div class="modal-body px-4 py-4">
                    <span class="notice-badge">신규 기능</span>
                    <h6 class="fw-bold mb-2">결재 참조 기능 추가</h6>
                    <p class="text-muted mb-0 text-pretty" style="font-size: 0.95rem;">
                        사전조사서 확인요청 처리 시 결재선과 함께 참조 대상자를 지정할 수 있습니다.
                    </p>
                    <figure class="notice-screenshot mb-0">
                        <img th:src="@{/images/rent_notice_260601.png}"
                             alt="확인 요청서 화면 — 결재선 및 참조자 추가 예시">
                        <figcaption class="notice-screenshot__caption">
                            확인 요청서 화면 예시 (결재자 · 참조자 추가)
                        </figcaption>
                    </figure>
                </div>
                <div class="modal-footer d-flex justify-content-between align-items-center">
                    <div class="form-check mb-0">
                        <input class="form-check-input" type="checkbox" id="noticeHideToday">
                        <label class="form-check-label text-muted small" for="noticeHideToday">오늘 하루 보지 않기</label>
                    </div>
                    <button type="button" class="btn btn-primary px-4" id="noticeConfirmBtn">확인</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            var STORAGE_KEY = 'rent_notice_approval_cc_hidden';
            var noticeEl = document.getElementById('noticeModal');
            if (!noticeEl) return;

            function todayKey() {
                var d = new Date();
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            }

            function shouldShowNotice() {
                try {
                    return localStorage.getItem(STORAGE_KEY) !== todayKey();
                } catch (e) {
                    return true;
                }
            }

            function hideNoticeForToday() {
                try {
                    localStorage.setItem(STORAGE_KEY, todayKey());
                } catch (e) {}
            }

            function closeNoticeModal() {
                var checkbox = document.getElementById('noticeHideToday');
                if (checkbox && checkbox.checked) {
                    hideNoticeForToday();
                }
                bootstrap.Modal.getOrCreateInstance(noticeEl).hide();
            }

            document.getElementById('noticeConfirmBtn').addEventListener('click', closeNoticeModal);

            if (shouldShowNotice()) {
                document.addEventListener('DOMContentLoaded', function () {
                    bootstrap.Modal.getOrCreateInstance(noticeEl).show();
                });
            }
        })();
    </script>
</body>
</html>
