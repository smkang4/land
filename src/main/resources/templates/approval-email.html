<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>승인 완료 안내</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <div style="max-width: 600px; margin: 0 auto; padding: 20px;">
        <h2 style="color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px;">임대차계약 승인 완료 안내</h2>
        
        <p th:text="${'안녕하세요, ' + userName + '님'}">안녕하세요, [이름]님</p>
        
        <p>귀하의 임대차계약이 승인되었음을 알려드립니다.</p>
        
        <div style="background-color: #f8f9fa; padding: 15px; border-radius: 5px; margin: 20px 0;">
            <p style="margin: 0;"><strong>계약번호:</strong> <span th:text="${contractNo}">[계약번호]</span></p>
        </div>
        
        <p>자세한 내용은 시스템에서 확인하실 수 있습니다.</p>
        
        <p>감사합니다.</p>
        
        <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee; font-size: 12px; color: #666;">
            <p>본 메일은 발신전용입니다. 문의사항은 관리자에게 연락해 주시기 바랍니다.</p>
        </div>
    </div>
</body>
</html>
