<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/head :: headFragment('접수함', 'grid')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/checkbox.css}">
    <link rel="stylesheet" th:href="@{/css/grid.css}">
    <link rel="stylesheet" th:href="@{/css/list-desk.css}">
</head>
<body class="app-shell--quiet">
<th:block th:with="backUrl=@{/main}, backText='메인화면'">
    <div th:replace="~{fragments/header :: siteHeader}"></div>
</th:block>

<main class="list-desk app-main">
    <div class="list-desk__shell">
        <header class="list-desk__head">
            <div class="list-desk__titles">
                <p class="list-desk__eyebrow">관리</p>
                <h1 class="list-desk__title text-balance">접수함</h1>
                <p class="list-desk__lead text-pretty">접수 대기 건을 확인하고 관리부서로 전달합니다</p>
            </div>
            <div class="list-desk__actions">
                <button type="button" class="btn btn-primary list-desk__btn" id="btnSelectConfirm">
                    <i class="bi bi-arrow-right-square" aria-hidden="true"></i> 관리부서접수
                </button>
                <button type="button" class="btn list-desk__btn list-desk__btn--danger" data-bs-toggle="collapse" data-bs-target="#apprBan" aria-expanded="false" aria-controls="apprBan">
                    <i class="bi bi-slash-square" aria-hidden="true"></i> 반려
                </button>
            </div>
        </header>

        <section class="list-desk__panel">
            <form id="search_form" method="get" class="list-desk__filters">
                <div class="list-desk__filter-field list-desk__filter-field--proj">
                    <label class="list-desk__label" for="sel_proj">현장</label>
                    <select id="sel_proj" name="proj_code" class="form-select" style="width:100%"></select>
                </div>
                <input type="hidden" name="appr_group" value="A">
                <input type="hidden" name="last_tag" value="T">
                <button type="button" class="btn btn-primary list-desk__btn" id="searchBtn" style="display:none" aria-hidden="true">조회</button>
            </form>

            <div class="collapse" id="apprBan">
                <div class="px-3 py-2 border-bottom bg-light">
                    <label class="form-label small text-muted mb-1" for="banRemark">반려 사유</label>
                    <textarea class="form-control" id="banRemark" rows="3" placeholder="반려 사유를 입력하세요"></textarea>
                </div>
            </div>

            <div class="list-desk__grid-wrap">
                <div id="grid" class="list-desk__grid"></div>
            </div>
        </section>
    </div>

    <!-- 관리부서 접수 Modal -->
    <div id="remark_popup" class="modal fade" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-3">
                <div class="modal-header py-3">
                    <h6 class="modal-title mb-0">관리부서 접수</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <div class="modal-body">
                    <label class="form-label small text-muted mb-1" for="next_emp_user">다음확인자</label>
                    <select class="form-control btn-conf mb-3" id="next_emp_user"></select>
                    <label class="form-label small text-muted mb-1" for="receipt_cc_users">참조(통보) — 여러 명 선택 가능</label>
                    <div class="approval-cc-select-wrap w-100 mb-3">
                        <select class="form-control btn-conf approval-cc-select" id="receipt_cc_users" multiple style="width:100%"></select>
                    </div>
                    <label class="form-label small text-muted mb-1" for="txtApprRemarks">의견</label>
                    <textarea class="form-control" placeholder="의견을 입력하세요" id="txtApprRemarks" rows="4"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="appr_confirm_no">취소</button>
                    <button type="button" class="btn btn-primary" id="appr_confirm_yes"><strong>확인</strong></button>
                </div>
            </div>
        </div>
    </div>
</main>

<script th:inline="javascript">

     var user_no = [[${#authentication.principal.userNo}]];
     var emp_no = [[${#authentication.principal.empNo}]];
     var dept_code = [[${#authentication.principal.deptCode}]];
     var proj_url = '/api/code/proj/'+user_no;

     ufn_select2_getData(proj_url,"#sel_proj","현장",dept_code,function(){});

    const grid = new Grid({
      el: document.getElementById('grid'),
      bodyHeight: 'fitToParent',
      rowHeight: 44,
      minRowHeight: 44,
      selection: {
          type: 'row',
          showCheckbox: true,
          enableCellSelection: false
      },
      focus: false,
      rowClassName: function(args) {
          var s = String(args.row.appr_stat == null ? '' : args.row.appr_stat);
          if (s === '3') return 'row-status-ok';
          if (s === '4') return 'row-status-reject';
          return 'row-status-wait';
      },
      rowHeaders: [
        { type: 'rowNum', width: 48, align: 'center', valign: 'middle' },
        {
            type: 'checkbox',
            width: 40,
            align: 'center',
            valign: 'middle',
            header:
            `<label for="all-checkbox" class="checkbox">
            <input type="checkbox" id="all-checkbox" class="hidden-input" name="_checked" />
            <span class="custom-input"></span>
            </label>` ,
            renderer: {
                type: CheckboxRenderer
            }
        }
      ],
      header:{
          height: 40,
          complexColumns: [
          {
            header: '고용허가기간',
            name: 'mergeColumn1',
            childNames: ['goyong_date1', 'goyong_date2']
          }
        ]
      },
      hideLoadingBar: false,
      pageOptions: {
        useClient: true,
        type: 'scroll',
        perPage: -1
      },
      columns: [
        { header: '계약seq',name: 'd_seq',width: 70, align: 'center',sortable: true ,hidden: true},
        { header: '결재순번',name: 'appr_num',width: 70, align: 'center',sortable: true ,hidden: true},
        { header: '결재번호',name: 'appr_no',width: 70, align: 'center',sortable: true ,hidden: true},
        { header: '확인자',name: 'appr_emp_no',width: 70, align: 'center',sortable: true ,hidden: true},
        { header: '확인상태',name: 'appr_stat',width: 96, align: 'center', valign: 'middle', sortable: true, escapeHTML: false
            ,formatter: function (e) {
                var v = e.value;
                var label = decode(v,'3','완료','4','반려','요청');
                var cls = 'list-status--wait';
                if (v === '3' || v === 3) cls = 'list-status--ok';
                else if (v === '4' || v === 4) cls = 'list-status--reject';
                return '<span class="list-status ' + cls + '">' + label + '</span>';
            }
        },
        { header: '확인',name: 'confirm',width: 56, align: 'center', valign: 'middle', sortable: false, escapeHTML: false
            ,formatter:function(e){
                if(e.row.appr_stat == '999'){
                    return '';
                }
                return '<button type="button" class="grid-act grid-act--appr" title="확인" aria-label="확인"><i class="bi bi-clipboard-check" aria-hidden="true"></i></button>';
            }
        },

        { header: '현장코드',name: 'proj_code',sortable: true, filter: 'text' , hidden: true},
        { header: '현장명',name: 'proj_name',width: 220, sortable: true, filter:{type:'text'}, align: 'left', valign: 'middle'},

        { header: '현장숙소 주소',name: 'address',width: 420, sortable: true, filter:{type:'text'}, align: 'left', valign: 'middle', escapeHTML: false
            ,formatter:function(e){
                var t = e.value == null ? '' : String(e.value);
                return '<button type="button" class="grid-addr" title="지도 보기">' + t + '</button>';
            }
        },

        { header: '요청자',name: 'first_appr_emp_nm',width: 88, align: 'center', valign: 'middle', sortable: true},
        { header: '요청일',name: 'first_appr_date',width: 104, align: 'center', valign: 'middle', sortable: true, escapeHTML: false
            ,formatter: function (e) {
                return '<span class="grid-num">' + toStringByFormatting(e.value) + '</span>';
            }
        },

        { header: '다음확인자',name: 'next_appr_emp_nm',width: 96, align: 'center', valign: 'middle', sortable: true},

        { header: '최종확인자',name: 'last_appr_emp_nm',width: 96, align: 'center', valign: 'middle', sortable: true},
        { header: '최종확인일',name: 'last_appr_date',width: 104, align: 'center', valign: 'middle', sortable: true, escapeHTML: false
            ,formatter: function (e) {
                return '<span class="grid-num">' + toStringByFormatting(e.value) + '</span>';
            }
        },
      ],
      columnOptions: {
        resizable: true
      }
    });

    grid.on('click',(ev)=>{
        if (ev.targetType === 'cell' && ev.columnName === 'address') {
            const rowIndex = ev.rowKey;
            const row = grid.getRow(rowIndex);

            openMap(row.address);
        }

        if (ev.targetType === 'cell' && ev.columnName === 'detail') {
            const rowIndex = ev.rowKey;
            const row = grid.getRow(rowIndex);

            openDetail(row.seq);
        }

        if (ev.targetType === 'cell' && ev.columnName === 'confirm') {

            const rowIndex = ev.rowKey;
            const row = grid.getRow(rowIndex);
            if(row.appr_stat == '999'){
                return false;
            }else if(row.appr_stat == '4'){
               var vHtml = "";
               vHtml += "<h3 class='text-center text-danger'>반려사유</h3>";
               vHtml += "<p class='pt-2'>"+row.reject+"</p>";
               MsgBox.Alert(vHtml);
               return false;
            }else{
                openApproval(row.appr_no);
            }
        }

        if (ev.targetType === 'cell' && ev.columnName === 'docu_file') {
            const rowIndex = ev.rowKey;
            const row = grid.getRow(rowIndex);
            if(row.fn_tg == 'F'){
                return false;
            }else{
                btnDocContractDown(row.seq);
            }
        }
    });

    grid.on('dblclick', (ev) => {
    });

    grid.on('check', (ev) => {
      var appr_stat = grid.getValue(ev.rowKey, "appr_stat");

      if(appr_stat == '3' || appr_stat == '4' ){
        MsgBox.Alert("*확인완료 또는 반려 처리된 문서는 선택이 불가능 합니다.");
        grid.uncheck(ev.rowKey);
      }
    });

    grid.on('checkAll', () => {
        var checkedRows = grid.getCheckedRows();
        checkedRows.forEach((row, index) => {
           if(row.appr_stat == '3' || row.appr_stat == '4' ){
                grid.uncheck(row.rowKey);
           }
        });
    });

    $("#searchBtn").on("click",function(e){
        G_load(grid,"/appr/list/admin","search_form");
    });

    $("#sel_proj").on("select2:select select2:clear", function() {
        G_load(grid,"/appr/list/admin","search_form");
    });

    function openMap(searchTxt){
        var options = "toolbar=no,scrollbars=no,resizable=yes,status=no,menubar=no,width=1200, height=900, top=10,left=100";
        window.open("https://map.naver.com/p/search/"+searchTxt, 'docu',options);
    }

    function openDetail(seq){
        var options = "toolbar=no,scrollbars=no,resizable=yes,status=no,menubar=no,width=1200, height=900, top=10,left=100";
        window.open("/detail?seq="+seq, 'docu',options);
    }

    function openApproval(appr_no){

        var options = "toolbar=no,scrollbars=no,resizable=yes,status=no,menubar=no,width=1200, height=900, top=10,left=100";
        window.open("/appr/reg/"+appr_no,"approval", options);

    }

    $("#btnSelectConfirm").on("click",function(){
        var grdData = grid.getCheckedRows();

        if(grdData.length == 0){
            MsgBox.Alert("*선택된 행(row)이 없습니다.");
            $(".btn-conf").prop("disabled",false);
            return false;
        }else{

             $.ajax({
                url: '/api/code/proj/admin',
                dataType: "json",
                contentType: "application/json; UTF-8;",
                success: function(data) {
                    console.log(data);
                    const formattedData = data.map(item => {
                            console.log("각 아이템:", item);
                            return {
                                id: item.emp_no,
                                text: item.name
                            };
                        });

                        if ($('#next_emp_user').data('select2')) {
                            $('#next_emp_user').select2('destroy');
                        }

                        $('#next_emp_user').empty();

                        $('#next_emp_user').append('<option value=""></option>');

                        data.forEach(function(item) {
                            $('#next_emp_user').append(
                                $('<option></option>')
                                    .val(item.emp_no)
                                    .text(item.name)
                            );
                        });

                        if ($('#next_emp_user').data('select2')) {
                            $('#next_emp_user').select2('destroy');
                        }

                        $('#next_emp_user').select2({
                            allowClear: true,
                            theme: "bootstrap-5",
                            placeholder: "다음확인자",
                            width: '100%',
                            dropdownParent: $('#remark_popup'),
                            minimumResultsForSearch: 0,
                            language: {
                                noResults: function() {
                                    return "검색 결과가 없습니다.";
                                }
                            }
                        });

                        if ($('#receipt_cc_users').data('select2')) {
                            $('#receipt_cc_users').select2('destroy');
                        }
                        $('#receipt_cc_users').empty();
                        data.forEach(function(item) {
                            $('#receipt_cc_users').append(
                                $('<option></option>').val(item.emp_no).text(item.name)
                            );
                        });
                        $('#receipt_cc_users').select2({
                            allowClear: true,
                            theme: "bootstrap-5",
                            placeholder: "참조자 복수 선택",
                            width: '100%',
                            closeOnSelect: false,
                            dropdownParent: $('#remark_popup'),
                            minimumResultsForSearch: 0
                        });
                        $('#receipt_cc_users').val(null).trigger('change');

                    },
                    error: function(xhr, status, error) {
                        console.error("API 호출 에러:", error);
                    }
            });

            $("#txtApprRemarks").val("");
            $("#remark_popup").modal("show");
        }
    });

     var receiptTotalCount = 0;
     var receiptCompletedCount = 0;
     var receiptReloadFlag = false;

     $("#appr_confirm_yes").on("click",function(){
        var grdData = grid.getCheckedRows();
        var appr_remarks = $("#txtApprRemarks").val();
        
        receiptTotalCount = grdData.length;
        receiptCompletedCount = 0;
        receiptReloadFlag = false;

        for(var i = 0 ; i <= grdData.length-1 ; i++){
             btnConfirmApply(grdData[i].d_seq,grdData[i].appr_no,grdData[i].appr_num,emp_no);
        }

        $("#remark_popup").modal("hide");

    });

    $("#appr_confirm_no").on("click",function(){
       $("#remark_popup").modal("hide");
    });


    function btnConfirmApply(d_seq,appr_no,appr_num,appr_emp_no){
        var next_emp_user = $("#next_emp_user").val();
        var next_emp_nm = $("#next_emp_user option:selected").text() || "";

        var params = "";
        params += "gubun=A";
        params += "&appr_d_seq="+d_seq;
        params += "&appr_emp_no="+appr_emp_no;
        params += "&appr_no="+appr_no;
        params += "&appr_num="+appr_num;
        params += "&next_emp_user="+next_emp_user;
        params += "&next_emp_nm="+encodeURIComponent(next_emp_nm);
        params += "&banRemark="+encodeURIComponent($("#txtApprRemarks").val());
        var ccVals = $('#receipt_cc_users').val() || [];
        if (ccVals.length > 0) {
            var ccPayload = ccVals.map(function(v) {
                var $opt = $('#receipt_cc_users option[value="' + v + '"]');
                return { empNo: parseInt(v, 10), empNm: ($opt.text() || '').trim() };
            });
            params += "&ccEmpNos=" + encodeURIComponent(JSON.stringify(ccPayload));
        }

        var vUrl = "/appr/update/detail";
        ufn_transaction(
            vUrl
            ,"POST"
            ,params
            ,"text"
            ,function(){}
            ,function(){
                receiptCompletedCount++;
                
                if(receiptCompletedCount >= receiptTotalCount && !receiptReloadFlag){
                    receiptReloadFlag = true;
                    
                    setTimeout(function() {
                        $(".btn-conf").prop("disabled",false);
                        G_load(grid,"/appr/list/admin","search_form");
                        
                        setTimeout(function() {
                            MsgBox.Alert("*확인완료");
                        }, 500);
                    }, 300);
                }
            }
            ,function(){
                receiptCompletedCount++;
                
                if(receiptCompletedCount >= receiptTotalCount && !receiptReloadFlag){
                    receiptReloadFlag = true;
                    
                    setTimeout(function() {
                        $(".btn-conf").prop("disabled",false);
                        G_load(grid,"/appr/list/admin","search_form");
                        
                        setTimeout(function() {
                            MsgBox.Alert("*일부 항목 처리 중 오류가 발생했습니다.");
                        }, 500);
                    }, 300);
                }
            },
            ""
        );
    }

    function init() {
       G_load(grid,"/appr/list/admin","search_form");
    }

    document.addEventListener('DOMContentLoaded', init);

</script>
</body>
</html>
