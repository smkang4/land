<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/head :: headFragment('조사서 확인 및 요청', 'grid')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/checkbox.css}">
    <link rel="stylesheet" th:href="@{/css/grid.css}">
    <link rel="stylesheet" th:href="@{/css/appr-submit-doc.css}">
    <link rel="stylesheet" th:href="@{/css/list-desk.css}">
</head>
<body class="app-shell--quiet">
<th:block th:with="backUrl=@{/main}, backText='메인화면'">
    <div th:replace="~{fragments/header :: siteHeader}"></div>
</th:block>

<main class="list-desk app-main">
    <div class="list-desk__shell">
        <header class="list-desk__head">
            <div class="list-desk__titles">
                <p class="list-desk__eyebrow">조사서</p>
                <h1 class="list-desk__title text-balance">확인 및 요청</h1>
                <p class="list-desk__lead text-pretty">등록한 사전조사서를 확인하고, 결재 요청·상태를 관리합니다</p>
            </div>
            <div class="list-desk__actions" id="listDeskActions">
                <button type="button" class="btn btn-primary list-desk__btn" id="btnApproval">
                    <i class="bi bi-send" aria-hidden="true"></i> 확인요청
                </button>
                <button type="button" class="btn list-desk__btn list-desk__btn--danger" id="btnStatDelete">
                    <i class="bi bi-trash" aria-hidden="true"></i> 삭제
                </button>
            </div>
        </header>

        <section class="list-desk__panel">
            <form id="search_form" method="get" class="list-desk__filters">
                <div class="list-desk__filter-field list-desk__filter-field--proj">
                    <label class="list-desk__label" for="sel_proj">현장</label>
                    <select id="sel_proj" name="proj_code" class="form-select" style="width:100%"></select>
                </div>
                <div class="list-desk__filter-field list-desk__filter-field--status">
                    <span class="list-desk__label">요청 상태</span>
                    <input type="hidden" id="sel_conf_tag" name="conf_tag" value="999">
                    <div class="seg appr-conf-tag-group" id="conf_tag_buttons" role="group" aria-label="요청 상태">
                        <button type="button" class="seg__btn conf-tag-btn active" data-conf-tag="999">요청전</button>
                        <button type="button" class="seg__btn conf-tag-btn" data-conf-tag="2">승인요청</button>
                        <button type="button" class="seg__btn conf-tag-btn" data-conf-tag="3">완료</button>
                        <button type="button" class="seg__btn conf-tag-btn" data-conf-tag="4">반려</button>
                    </div>
                </div>
            </form>

            <div class="list-desk__grid-wrap">
                <div id="grid" class="list-desk__grid"></div>
            </div>
        </section>
    </div>
    <!-- 확인요청 결재문서 Modal -->
    <div id="appr_popup" class="modal fade" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content rounded-3">
                <div class="modal-header py-3">
                    <h6 class="modal-title mb-0">확인 요청서</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <div class="modal-body appr-submit-doc">
                    <div class="appr-submit-doc__title">사전조사 확인 요청</div>
                    <div class="appr-submit-doc__meta" id="appr_submit_meta">선택 건수: 0건</div>

                    <div class="appr-submit-doc__section">
                        <div class="appr-submit-doc__section-title">결재선 미리보기</div>
                        <div class="appr-submit-line" id="appr_line_preview"></div>
                        <div class="appr-submit-cc-preview d-none" id="appr_cc_preview">
                            <div class="appr-submit-cc-preview__label">참조</div>
                            <div class="appr-submit-line appr-submit-line--cc" id="appr_cc_line"></div>
                        </div>
                    </div>

                    <div class="appr-submit-doc__section">
                        <div class="appr-submit-doc__section-title">결재</div>
                        <div id="appr_field_lines"></div>
                        <button type="button" class="btn btn-sm btn-outline-secondary" id="btn_add_field_line">
                            <i class="bi bi-plus"></i> 결재자 추가
                        </button>
                        <p class="form-hint small text-muted mt-2 mb-0">* 현장소장·대리인이 없으면 「본인」을 선택하세요.</p>
                    </div>
                    <div class="appr-submit-doc__section">
                        <div class="appr-submit-doc__section-title">참조</div>
                        <div id="appr_cc_lines"></div>
                        <button type="button" class="btn btn-sm btn-outline-secondary" id="btn_add_cc_line">
                            <i class="bi bi-plus"></i> 참조자 추가
                        </button>
                        <p class="form-hint small text-muted mt-2 mb-0">* 참조자는 결재 진행에 영향 없이 조회·메일 통보만 됩니다.</p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="appr_confirm_no" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-primary" id="appr_confirm_yes"><strong>상신</strong></button>
                </div>
            </div>
        </div>
    </div>
</main>
    <div th:replace="~{fragments/modal.html :: fragment-modal}"></div>


    <script th:inline="javascript">

         var user_no = [[${#authentication.principal.userNo}]];
         var dept_code = [[${#authentication.principal.deptCode}]];
         var proj_url = '/api/code/proj/'+user_no;
         var submitter_emp_no = [[${#authentication.principal.empNo}]];
         var submitter_name = [[${#authentication.principal.userName}]];
         var submitter_position = [[${#authentication.principal.positionName}]];

         var apprUserList = [];
         var apprSubmitRowData = [];
         var apprSubmitProjCode = '';

         ufn_select2_getData(proj_url,"#sel_proj","현장","",function(){});

         const grid = new Grid({
           el: document.getElementById('grid'),
           bodyHeight: 'fitToParent',
           rowHeight: 44,
           minRowHeight: 44,
           selection: {
               type: 'row',
               showCheckbox: true,
               enableCellSelection: false
           },
           focus: false,
           rowClassName: function(args) {
               var s = String(args.row.appr_stat == null ? '' : args.row.appr_stat);
               if (s === '3') return 'row-status-ok';
               if (s === '4') return 'row-status-reject';
               if (s === '1' || s === '2') return 'row-status-progress';
               if (s === '0') return 'row-status-wait';
               return '';
           },
           rowHeaders: [
             { type: 'rowNum', width: 48, align: 'center', valign: 'middle' },
             {
                 type: 'checkbox',
                 width: 40,
                 align: 'center',
                 valign: 'middle',
                 header:
                 `<label for="all-checkbox" class="checkbox">
                 <input type="checkbox" id="all-checkbox" class="hidden-input" name="_checked" />
                 <span class="custom-input"></span>
                 </label>` ,
                 renderer: {
                     type: CheckboxRenderer
                 }
             }
           ],
           header:{
               height: 40,
               complexColumns: [
               {
                 header: '고용허가기간',
                 name: 'mergeColumn1',
                 childNames: ['goyong_date1', 'goyong_date2']
               }
             ]
           },
           hideLoadingBar: false,
           pageOptions: {
             useClient: true,
             type: 'scroll',
             perPage: -1
           },
           sortingOptions: {
             useClient: true,
             initialState: {
               columnName: 'seq',
               ascending: false
             }
           },
           columns: [
             { header: '계약번호', name: 'seq', width: 70, align: 'center', sortable: true, sortingType: 'desc', hidden: true },
             { header: '결재번호',name: 'appr_no',width: 70, align: 'center',sortable: true ,hidden: true},
             { header: '결재상태',name: 'appr_stat',width: 96, align: 'center', valign: 'middle', sortable: true, escapeHTML: false
                 ,formatter: function (e) {
                     var v = e.value;
                     var label = decode(v,'0','승인요청','1','진행중','2','진행중','3','승인완료','4','반려','요청전');
                     var cls = 'list-status--idle';
                     if (v === '0' || v === 0) cls = 'list-status--wait';
                     else if (v === '1' || v === 1 || v === '2' || v === 2) cls = 'list-status--progress';
                     else if (v === '3' || v === 3) cls = 'list-status--ok';
                     else if (v === '4' || v === 4) cls = 'list-status--reject';
                     return '<span class="list-status ' + cls + '">' + label + '</span>';
                 }
             },
             { header: '반려사유',name: 'reject',width: 150, align: 'left', valign: 'middle', sortable: true, hidden: true
                 ,formatter: function (e) {
                     return e.value || '';
                 }
             },
             { header: '재작성',name: 'rewrite',width: 56, align: 'center', valign: 'middle', sortable: false, hidden: true, escapeHTML: false
                 ,formatter: function(e) {
                     if(e.value === 'Y'){
                         return '<button type="button" class="grid-act" disabled title="재작성 불가" aria-label="재작성 불가"><i class="bi bi-pencil" aria-hidden="true"></i></button>';
                     }
                     return '<button type="button" class="grid-act grid-act--edit" title="재작성" aria-label="재작성"><i class="bi bi-pencil" aria-hidden="true"></i></button>';
                 }
             },
             { header: '상세',name: 'detail',width: 56, align: 'center', valign: 'middle', sortable: false, hidden: false, escapeHTML: false
                 ,formatter:function(e){
                     return '<button type="button" class="grid-act" title="상세" aria-label="상세"><i class="bi bi-file-earmark-text" aria-hidden="true"></i></button>';
                 }
             },
             { header: '결재',name: 'confirm',width: 56, align: 'center', valign: 'middle', sortable: false, hidden: false, escapeHTML: false
                 ,formatter:function(e){
                     if(e.row.appr_stat == '999'){
                         return '';
                     }
                     return '<button type="button" class="grid-act grid-act--appr" title="결재" aria-label="결재"><i class="bi bi-clipboard-check" aria-hidden="true"></i></button>';
                 }
             },
             { header: '현장코드',name: 'proj_code',sortable: true, filter: 'text' , hidden: true},
             { header: '현장명',name: 'proj_name',width: 220, sortable: true, filter:{type:'text'}, align: 'left', valign: 'middle'},

             { header: '주거형태',name: 'res_type',width: 76, align: 'center', valign: 'middle', sortable: true,hidden:false},
             { header: '거래방식',name: 'trans_type',width: 76, align: 'center', valign: 'middle', sortable: true,hidden:false},
             { header: '면적',name: 'area',width: 72, align: 'center', valign: 'middle', sortable: true,hidden:false},
             { header: '사용인원',name: 'accu',width: 72, align: 'center', valign: 'middle', sortable: true,hidden:false},
             { header: '현장숙소 주소',name: 'address',width: 420, sortable: true, filter:{type:'text'}, align: 'left', valign: 'middle', escapeHTML: false
                   ,formatter:function(e){
                       var t = e.value == null ? '' : String(e.value);
                       return '<button type="button" class="grid-addr" title="지도 보기">' + t + '</button>';
                   }
             },
             { header: '계약(예정)일',name: 'cont_date',sortable: true ,width: 104, align: 'center', valign: 'middle', hidden: false, escapeHTML: false,
                  formatter: function (e) {
                     return '<span class="grid-num">' + toStringByFormatting(e.value) + '</span>';
                 }
             },
             { header: '입주(예정)일',name: 'move_date',sortable: true ,width: 104, align: 'center', valign: 'middle', hidden: false, escapeHTML: false,
                 formatter: function (e) {
                     return '<span class="grid-num">' + toStringByFormatting(e.value) + '</span>';
                 }
             },

             { header: '보증금',name: 'deposit_amt',width: 100, align: 'right', valign: 'middle', sortable: true, escapeHTML: false,
                 formatter: function (e) {
                     return '<span class="grid-num">' + ufn_comma(e.value) + '</span>';
                 }
             },
             { header: '월세',name: 'rent_amt',width: 100, align: 'right', valign: 'middle', sortable: true, escapeHTML: false,
                 formatter: function (e) {
                     return '<span class="grid-num">' + ufn_comma(e.value) + '</span>';
                 }
             },

           ],
           columnOptions: {
             resizable: true
           }
         });

         grid.on('click',(ev)=>{
             if (ev.targetType === 'cell' && ev.columnName === 'address') {
                 const rowIndex = ev.rowKey;
                 const row = grid.getRow(rowIndex);

                 openMap(row.address);
             }

             if (ev.targetType === 'cell' && ev.columnName === 'detail') {
                 const rowIndex = ev.rowKey;
                 const row = grid.getRow(rowIndex);

                 openDetail(row.seq);
             }

             if (ev.targetType === 'cell' && ev.columnName === 'confirm') {

                 const rowIndex = ev.rowKey;
                 const row = grid.getRow(rowIndex);
                 if(row.appr_stat == '999'){
                     return false;
                 }else if(row.appr_stat == '4'){
                    var vHtml = "";
                    vHtml += "<h3 class='text-center text-danger'>반려사유</h3>";
                    vHtml += "<p class='pt-2'>"+row.reject+"</p>";
                    MsgBox.Alert(vHtml);
                    return false;
                 }else{
                     openApproval(row.appr_no);
                 }
             }

             if (ev.targetType === 'cell' && ev.columnName === 'docu_file') {
                 const rowIndex = ev.rowKey;
                 const row = grid.getRow(rowIndex);
                 if(row.fn_tg == 'F'){
                     return false;
                 }else{
                     btnDocContractDown(row.seq);
                 }
             }

             if (ev.targetType === 'cell' && ev.columnName === 'rewrite') {
                 const rowIndex = ev.rowKey;
                 const row = grid.getRow(rowIndex);
                 
                 // rewrite 값이 'Y'인 경우 클릭 이벤트 처리하지 않음
                 if(row.rewrite === 'Y'){
                     return false;
                 }
                 
                 MsgBox.Confirm("재작성하시겠습니까?", function() {
                     // 재작성 로직 - edit.html로 이동
                     var options = "toolbar=no,scrollbars=no,resizable=yes,status=no,menubar=no,width=1200, height=900, top=10,left=100";
                     window.open("/rewrite?seq=" + row.seq, 'rewrite', options);
                 });
             }
         });

         grid.on('dblclick', (ev) => {
             //console.log(ev.rowKey+"//"+ev.columnName);
             //var vData = grid.getValue(ev.rowKey, ev.columnName);
             //console.log(vData);
         });

         grid.on('check', (ev) => {
           var appr_stat = grid.getValue(ev.rowKey, "appr_stat");

           if(appr_stat != '999'){
             MsgBox.Alert("*결재가 진행중인 건은 선택이 불가합니다. ");
             grid.uncheck(ev.rowKey);
           }
         });

         grid.on('checkAll', () => {
             var checkedRows = grid.getCheckedRows();
             checkedRows.forEach((row, index) => {
                 if (row.appr_stat != '999') {
                     const rowIndex = grid.getIndexOfRow(row.rowKey);
                     grid.uncheck(rowIndex);
                 }
             });
         });



         function getConfTag() {
             return $("#sel_conf_tag").val();
         }

         function setConfTag(confTag) {
             $("#sel_conf_tag").val(confTag);
             $(".conf-tag-btn").removeClass("active");
             $('.conf-tag-btn[data-conf-tag="' + confTag + '"]').addClass("active");
             updateConfTagUi(confTag);
         }

         function updateConfTagUi(confTag) {
             if (confTag === "2" || confTag === "3") {
                 grid.hideColumn('detail');
             } else {
                 grid.showColumn('detail');
             }

             if (confTag === "4") {
                 grid.hideColumn('confirm');
                 grid.showColumn('reject');
                 grid.hideColumn('_checked');
                 grid.showColumn('rewrite');
             } else if (confTag === "999") {
                 grid.hideColumn('confirm');
                 grid.hideColumn('reject');
                 grid.showColumn('_checked');
                 grid.hideColumn('rewrite');
             } else {
                 grid.showColumn('confirm');
                 grid.hideColumn('reject');
                 grid.hideColumn('_checked');
                 grid.hideColumn('rewrite');
             }

             if (confTag === "2" || confTag === "3" || confTag === "4") {
                 $("#btnApproval").hide();
                 $("#btnStatDelete").hide();
             } else {
                 $("#btnApproval").show();
                 $("#btnStatDelete").show();
             }
         }

         function loadContractList() {
             updateConfTagUi(getConfTag());
             G_load(grid, "/api/cont_list", "search_form");
         }

         $(".conf-tag-btn").on("click", function() {
             var confTag = String($(this).data("conf-tag"));
             if (confTag === getConfTag()) {
                 return;
             }
             setConfTag(confTag);
             loadContractList();
         });

         $("#sel_proj").on("select2:select select2:clear", function() {
             loadContractList();
         });


         function openMap(searchTxt){
             var options = "toolbar=no,scrollbars=no,resizable=yes,status=no,menubar=no,width=1200, height=900, top=10,left=100";
             window.open("https://map.naver.com/p/search/"+searchTxt, 'docu',options);
         }

         function openDetail(seq){
             var options = "toolbar=no,scrollbars=no,resizable=yes,status=no,menubar=no,width=1200, height=900, top=10,left=100";
             window.open("/detail?seq="+seq, 'docu',options);
         }

         function openApproval(appr_no){

            var options = "toolbar=no,scrollbars=no,resizable=yes,status=no,menubar=no,width=1200, height=900, top=10,left=100";
             window.open("/appr/reg/"+appr_no,"approval", options);

         }

         function loadApprSubmitFormData(callback) {
             $.getJSON('/api/code/proj/user').done(function(data) {
                 apprUserList = data || [];
                 if (typeof callback === 'function') callback();
             }).fail(function() {
                 MsgBox.Alert('결재자 목록을 불러오지 못했습니다.');
             });
         }

         function initApprLineSelect($sel, placeholder) {
             if ($sel.data('select2')) {
                 $sel.select2('destroy');
             }
             $sel.empty().append('<option value="">선택</option><option value="0">본인</option>');
             apprUserList.forEach(function(u) {
                 $sel.append($('<option></option>').val(u.id).text(u.text));
             });
             $sel.select2({
                 theme: 'bootstrap-5',
                 placeholder: placeholder,
                 allowClear: true,
                 width: '100%',
                 dropdownParent: $('#appr_popup')
             });
         }

         function addFieldLineRow(selectedId) {
             var $row = $('<div class="appr-line-row"></div>');
             var $sel = $('<select class="form-select form-select-sm appr-line-emp-select"></select>');
             $row.append($sel);
             $row.append('<button type="button" class="btn btn-sm btn-outline-danger btn-remove-line" title="삭제"><i class="bi bi-x"></i></button>');
             $('#appr_field_lines').append($row);
             initApprLineSelect($sel, '현장 결재자');
             if (selectedId) {
                 $sel.val(String(selectedId)).trigger('change');
             }
             $row.find('.btn-remove-line').on('click', function() {
                 $sel.select2('destroy');
                 $row.remove();
                 refreshApprLinePreview();
             });
             $sel.on('change', refreshApprLinePreview);
         }

         function resolveEmpDisplay(empId) {
             if (!empId || empId === '0') {
                 return { name: submitter_name, position: submitter_position || '기안' };
             }
             var found = apprUserList.find(function(u) { return String(u.id) === String(empId); });
             if (found) {
                 var parts = (found.text || '').split(' ');
                 return { name: parts[0] || found.text, position: parts.slice(1).join(' ') || '결재' };
             }
             return { name: '-', position: '' };
         }

         function refreshApprLinePreview() {
             var html = '';
             html += '<div class="appr-submit-line__card appr-submit-line__card--draft">';
             html += '<div class="appr-submit-line__pos">기안</div>';
             html += '<div class="appr-submit-line__name">' + submitter_name + '</div>';
             html += '<div class="appr-submit-line__status">상신</div></div>';

             var fieldIds = [];
             $('#appr_field_lines .appr-line-emp-select').each(function() {
                 var v = $(this).val();
                 if (v === '' || v === null) return;
                 fieldIds.push(v);
             });
             fieldIds.forEach(function(v) {
                 html += '<span class="appr-submit-arrow"><i class="bi bi-chevron-right"></i></span>';
                 var emp = resolveEmpDisplay(v);
                 html += '<div class="appr-submit-line__card">';
                 html += '<div class="appr-submit-line__pos">다음 결재자</div>';
                 html += '<div class="appr-submit-line__name">' + emp.name + '</div>';
                 html += '<div class="appr-submit-line__status">확인대기</div></div>';
             });
             $('#appr_line_preview').html(html);

             var ccHtml = '';
             var ccIds = collectCcEmpIds();
             ccIds.forEach(function(v) {
                 var emp = resolveEmpDisplay(v);
                 ccHtml += '<div class="appr-submit-line__card appr-submit-line__card--cc">';
                 ccHtml += '<div class="appr-submit-line__pos">참조</div>';
                 ccHtml += '<div class="appr-submit-line__name appr-submit-line__name--cc">' + emp.name + '</div></div>';
             });
             $('#appr_cc_line').html(ccHtml);
             if (ccIds.length > 0) {
                 $('#appr_cc_preview').removeClass('d-none');
             } else {
                 $('#appr_cc_preview').addClass('d-none');
             }
         }

         function collectApprovalLines() {
             var lines = [];
             $('#appr_field_lines .appr-line-emp-select').each(function() {
                 var v = $(this).val();
                 if (v === '' || v === null) return;
                 var empNo = parseInt(v, 10);
                 var emp = resolveEmpDisplay(v);
                 if (empNo === 0) empNo = submitter_emp_no;
                 lines.push({ empNo: empNo, empNm: emp.name, phase: 'FIELD', isFinal: 'F' });
             });
             return lines;
         }

         function initCcLineSelect($sel, placeholder) {
             if ($sel.data('select2')) {
                 $sel.select2('destroy');
             }
             $sel.empty().append('<option value="">선택</option>');
             apprUserList.forEach(function(u) {
                 $sel.append($('<option></option>').val(u.id).text(u.text));
             });
             $sel.select2({
                 theme: 'bootstrap-5',
                 placeholder: placeholder,
                 allowClear: true,
                 width: '100%',
                 dropdownParent: $('#appr_popup')
             });
         }

         function addCcLineRow(selectedId) {
             var $row = $('<div class="appr-line-row"></div>');
             var $sel = $('<select class="form-select form-select-sm appr-line-cc-select"></select>');
             $row.append($sel);
             $row.append('<button type="button" class="btn btn-sm btn-outline-danger btn-remove-line" title="삭제"><i class="bi bi-x"></i></button>');
             $('#appr_cc_lines').append($row);
             initCcLineSelect($sel, '참조자');
             if (selectedId) {
                 $sel.val(String(selectedId)).trigger('change');
             }
             $row.find('.btn-remove-line').on('click', function() {
                 $sel.select2('destroy');
                 $row.remove();
                 refreshApprLinePreview();
             });
             $sel.on('change', refreshApprLinePreview);
         }

         function collectCcEmpIds() {
             var ids = [];
             $('#appr_cc_lines .appr-line-cc-select').each(function() {
                 var v = $(this).val();
                 if (v === '' || v === null) return;
                 ids.push(v);
             });
             return ids;
         }

         function collectCcEmpNos() {
             return collectCcEmpIds().map(function(v) {
                 var emp = resolveEmpDisplay(v);
                 return { empNo: parseInt(v, 10), empNm: emp.name };
             });
         }

         function openApprSubmitModal(rowDataArray, chkProjCode) {
             apprSubmitRowData = rowDataArray;
             apprSubmitProjCode = chkProjCode;
             $('#appr_submit_meta').text('선택 건수: ' + rowDataArray.length + '건');
             loadApprSubmitFormData(function() {
                 $('#appr_field_lines').empty();
                 addFieldLineRow('');
                 $('#appr_cc_lines').empty();
                 refreshApprLinePreview();
                 $('#appr_popup').modal('show');
             });
         }

         function processApprovalRequest() {
             var lines = collectApprovalLines();
             if (lines.filter(function(l) { return l.phase === 'FIELD'; }).length === 0) {
                 MsgBox.Alert('*현장 결재자를 1명 이상 선택해 주세요.');
                 return;
             }
             var hasSelfOnly = lines.filter(function(l) { return l.phase === 'FIELD'; }).length === 1
                 && lines.filter(function(l) { return l.phase === 'FIELD'; })[0].empNo === submitter_emp_no;
             var confirmMessage = '*선택된 ' + apprSubmitRowData.length + '건을 확인요청 하시겠습니까?';
             if (hasSelfOnly) {
                 confirmMessage += "<br><br><strong style='color: #dc3545;'>현장소장이 없는 경우에만 본인 선택이 가능합니다.<br>그렇지 않은 경우 해당 요청은 반려될 수 있습니다.</strong>";
             }
             MsgBox.Confirm(confirmMessage, function() {
                 $.ajax({
                     url: '/appr/multi/apply',
                     type: 'POST',
                     contentType: 'application/json',
                     data: JSON.stringify({
                         arrayList: apprSubmitRowData,
                         proj_code: apprSubmitProjCode,
                         approvalLines: lines,
                         ccEmpNos: collectCcEmpNos()
                     }),
                     success: function() {
                         $('#appr_popup').modal('hide');
                         setConfTag('2');
                         loadContractList();
                     },
                     error: function(xhr) {
                         var msg = (xhr.responseJSON && xhr.responseJSON.msg) ? xhr.responseJSON.msg : '상신 처리 중 오류가 발생했습니다.';
                         MsgBox.Alert(msg);
                     }
                 });
             });
         }

         $('#btn_add_field_line').on('click', function() {
             addFieldLineRow('');
         });

         $('#btn_add_cc_line').on('click', function() {
             addCcLineRow('');
         });

         $('#appr_confirm_yes').off('click.apprSubmit').on('click.apprSubmit', function() {
             processApprovalRequest();
         });

         $("#btnApproval").on("click", function() {
             var checkedRows = grid.getCheckedRows();
             var chkProjCode = '';
             var rowDataArray = [];

             if (checkedRows.length === 0) {
                 MsgBox.Alert("*선택된 데이터가 없습니다.");
                 return false;
             }

             for (let index = 0; index < checkedRows.length; index++) {
                 let row = checkedRows[index];
                 if (index === 0) {
                     chkProjCode = row.proj_code;
                 }
                 if (row.proj_code !== chkProjCode) {
                     grid.uncheck(grid.getIndexOfRow(row.rowKey));
                     MsgBox.Alert("*동일 현장만 묶음결재가 가능합니다.");
                     return false;
                 }
                 rowDataArray.push(row.seq);
             }
             openApprSubmitModal(rowDataArray, chkProjCode);
         });

            function init() {
                setConfTag(getConfTag());
                loadContractList();
            }

         document.addEventListener('DOMContentLoaded', init);

         // 삭제 버튼 클릭 이벤트
         $("#btnStatDelete").on("click", function() {
             const checkedRows = grid.getCheckedRows();
             if (checkedRows.length === 0) {
                 MsgBox.Alert("삭제할 항목을 선택해주세요.");
                 return;
             }

             MsgBox.Confirm("선택한 계약을 삭제하시겠습니까?", function() {
                 const seqList = checkedRows.map(row => row.seq);

                 $.ajax({
                     url: '/api/cont/delete',
                     type: 'POST',
                     contentType: 'application/json',
                     data: JSON.stringify({ seqList: seqList }),
                     success: function(response) {
                         if (response.success) {
                             MsgBox.Alert(response.message);
                             loadContractList();
                         } else {
                             MsgBox.Alert(response.message);
                         }
                     },
                     error: function(xhr, status, error) {
                         MsgBox.Alert("계약 삭제 중 오류가 발생했습니다.");
                         console.error('Delete error:', error);
                     }
                 });
             });
         });

    </script>
</body>
</html>
