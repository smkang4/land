<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/spoqa-han-sans@2.1.2/css/SpoqaHanSansNeo.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/checkbox.css}">
    <link rel="stylesheet" th:href="@{/css/grid.css}">

    <!-- Select2   -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" />

    <!-- Toast Grid-->
    <link rel="stylesheet" href="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css" />
    <link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
    <style>
        @charset "UTF-8";
        .container-fluid {
          height: 92%;
        }

        /* 포커스 상태일 때 생기는 테두리 제거 */
        .tui-grid-cell.tui-grid-cell-has-focus {
          outline: none !important;
          box-shadow: none !important;
          border: none !important;
        }

        /* 혹시 생길 수 있는 내부 엘리먼트 포커스도 제거 */
        .tui-grid-cell-content:focus {
          outline: none !important;
          box-shadow: none !important;
          border: none !important;

    </style>
</head>
<body>
<header class="main-header">
    <div class="header-content">
        <div class="logo-container">
            <img src="/images/dongah.gif" alt="로고" class="logo">
            <span class="header-title">부동산 임차관리 플랫폼</span>
        </div>
        <div class="user-info">
            <span class="user-name" th:text="${#authentication.principal.deptName}"></span>
            <span class="user-name" th:text="${#authentication.principal.userName + #authentication.principal.positionName}"></span>
            <a href="/" class="btn btn-back me-2">
                <i class="bi bi-arrow-left"></i> 메인화면
            </a>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-action">로그아웃</button>
            </form>
        </div>
    </div>
</header>

<main>
    <div class="container-fluid">
       <div class="row mb-4">
           <h3>사전조사서 확인 및 요청</h3>
           <span>본인이 등록한 사전조사서의 확인요청과 요청 상태를 확인 할 수 있습니다</span>
       </div>


        <div class="row mb-2">
            <div class="col col-12 col-sm-12">
                <form id="search_form" method="get">

                    <div class="row mb-1 bg-style-search">
                        <div class="col-sm-5">
                            <select id="sel_proj" name="proj_code" class="form-select form-select-sm"  style="width:100%"></select>
                        </div>
                        <div class="col-sm-1">
                            <select id="sel_conf_tag" name="conf_tag" class="form-select form-select-sm" style="width:100%">
                                <option value="999">요청전</option>
                                <option value="2">승인요청</option>
                                <option value="3">완료</option>
                                <option value="4">반려</option>
                            </select>
                        </div>
                        <div class="col-auto">
                            <button type="button" class="btn btn-sm btn-secondary btn_s" id="searchBtn"><i class="bi bi-search"></i> 조회</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="row mb-1">
            <div class="col col-12">
                <button class="btn btn-sm btn-primary" id="btnApproval"><i class="bi bi-collection"></i> 확인요청(선택)</button>
                <button class="btn btn-sm btn-danger" id="btnStatDelete"><i class="bi bi-trash"></i> 삭제(선택)</button>
            </div>
        </div>
        <div class="row" style="height: calc(100vh - 250px);">
            <div class="col col-12" id="grid" style="height: 100%;"></div>
        </div>
    </div>
    <!-- 결재라인 Modal -->
    <div id="appr_popup" class="modal fade" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" role="dialog" >
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content rounded-3 shadow">
                <div class="modal-header p-4 text-center">
                    <h6>요청서상신-현장소장/대리인 선택</h6>
                </div>
                <div class="modal-body p-4 text-center">
                    <select id="sel_confirm_user" class="form-select form-select-sm"  style="width:100%"></select>
                    <p class="p-1">*현장소장 또는 대리인이 없을 경우 본인 선택</p>
                </div>

                <div class="modal-footer flex-nowrap p-0" id="">
                    <button type="button" id="appr_confirm_yes" class="btn btn-lg btn-link fs-6 text-decoration-none col-6 py-3 m-0 rounded-0 border-end" data-bs-dismiss=""><strong>상신</strong></button>
                    <button type="button" id="appr_confirm_no" class="btn btn-lg btn-link fs-6 text-decoration-none col-6 py-3 m-0 rounded-0" data-bs-dismiss="">취소</button>
                </div>

            </div>
        </div>
    </div>
</main>
    <div th:replace="~{fragments/modal.html :: fragment-modal}"></div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <!-- Toast Grid  -->
    <script src="https://uicdn.toast.com/tui.date-picker/latest/tui-date-picker.js"></script>
    <script src="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.1/xlsx.full.min.js"></script>
    <script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
    <script src="js/grid_custom.js" th:src="@{/js/grid_custom.js}"></script>
    <!-- Custom   -->
    <script src="js/common.js?v=1.0.3" th:src="@{/js/common.js?v=1.0.3}"></script>

    <script th:inline="javascript">

         var user_no = [[${#authentication.principal.userNo}]];
         var dept_code = [[${#authentication.principal.deptCode}]];
         var proj_url = '/api/code/proj/'+user_no;

         ufn_select2_getData(proj_url,"#sel_proj","현장",dept_code,function(){});
         
         // sel_confirm_user에 기본 옵션과 본인 옵션 추가 후 API 데이터 로드
         $('#sel_confirm_user').empty().append('<option value="">선택</option><option value="0">본인</option>');
         $.ajax({
             url: '/api/code/proj/user',
             dataType: "json",
             contentType: "application/json; UTF-8;",
             success: function(data) {
                 $('#sel_confirm_user').select2({
                     allowClear: true,
                     theme: "bootstrap-5",
                     placeholder: "현장소장/대리인",
                     data: data,
                     dropdownParent: $('#sel_confirm_user').closest('.modal')
                 });
                 
                 // 기본값으로 "선택" 옵션 선택
                 $('#sel_confirm_user').val('').trigger('change');
             }
         });

         const grid = new Grid({
           el: document.getElementById('grid'), // Container element
           //data: dataSource,
           bodyHeight: 'fitToParent',
           rowHeight: 50,
           selection: {
               type: 'row',
               showCheckbox: true,
               enableCellSelection: false
           },
           focus: false,
           rowHeaders: [
             { type: 'rowNum', width: 30, align: 'center', valign: 'middle' },
             {
                 type: 'checkbox',
                 header:
                 `<label for="all-checkbox" class="checkbox">
                 <input type="checkbox" id="all-checkbox" class="hidden-input" name="_checked" />
                 <span class="custom-input"></span>
                 </label>` ,
                 renderer: {
                     type: CheckboxRenderer
                 }
             }
           ],
           header:{
               height: 50,
               complexColumns: [
               {
                 header: '고용허가기간',
                 name: 'mergeColumn1',
                 childNames: ['goyong_date1', 'goyong_date2']
               }
             ]
           },
           hideLoadingBar: false,
           pageOptions: {
             useClient: true,
             type: 'scroll',
             perPage: -1
           },
           sortingOptions: {
             useClient: true,
             initialState: {
               columnName: 'seq',
               ascending: false
             }
           },
           columns: [
             { header: '계약번호', name: 'seq', width: 70, align: 'center', sortable: true, sortingType: 'desc', hidden: true },
             { header: '결재번호',name: 'appr_no',width: 70, align: 'center',sortable: true ,hidden: true},
             { header: '결재상태',name: 'appr_stat',width: 90, align: 'center',sortable: true
                 ,formatter: function (e) {
                     return decode(e.value,'0','승인요청','1','진행중','2','진행중','3','승인완료','4','반려','요청전')
                 }
             },
             { header: '반려사유',name: 'reject',width: 150, align: 'left',sortable: true, hidden: true
                 ,formatter: function (e) {
                     return e.value || '';
                 }
             },
             { header: '재작성',name: 'rewrite',width: 70, align: 'center',sortable: false, hidden: true
                 ,formatter: function(e) {
                     if(e.value === 'Y'){
                         return '<button class="btn btn-sm btn-secondary btn-grid" disabled><i class="bi bi-pencil"></i></button>'
                     }else{
                         return '<button class="btn btn-sm btn-success btn-grid"><i class="bi bi-pencil"></i></button>'
                     }
                 }
             },
             { header: '상세',name: 'detail',width: 70, align: 'center',sortable: false, hidden: false
                 ,formatter:function(e){
                     return '<button class="btn btn-sm btn-dark btn-grid"><i class="bi bi-file-text"></i></button>'
                 }
             },
             { header: '결재',name: 'confirm',width: 70, align: 'center',sortable: false, hidden: false
                 ,formatter:function(e){
                     if(e.row.appr_stat == '999'){
                         return '';
                     }else{
                         return '<button class="btn btn-sm btn-warning btn-grid"><i class="bi bi-file-text"></i></button>'
                     }
                 }
             },
             { header: '현장코드',name: 'proj_code',sortable: true, filter: 'text' , hidden: true},
             { header: '현장명',name: 'proj_name',width: 250, sortable: true, filter:{type:'text'}, align: 'left'},

             { header: '주거형태',name: 'res_type',width: 80, align: 'center',sortable: true,hidden:false},
             { header: '거래방식',name: 'trans_type',width: 80, align: 'center',sortable: true,hidden:false},
             { header: '면적',name: 'area',width: 80, align: 'center',sortable: true,hidden:false},
             { header: '사용인원',name: 'accu',width: 80, align: 'center',sortable: true,hidden:false},
             { header: '현장숙소 주소',name: 'address',width: 500, sortable: true, filter:{type:'text'}
                   ,formatter:function(e){
                       return '<a href="#">'+e.value+'</a>'
                   }
             },
             { header: '계약(예정)일',name: 'cont_date',sortable: true ,width: 100, align: 'center', hidden: false,
                  formatter: function (e) {
                     return toStringByFormatting(e.value)
                 }
             },
             { header: '입주(예정)일',name: 'move_date',sortable: true ,width: 100, align: 'center', hidden: false,
                 formatter: function (e) {
                     return toStringByFormatting(e.value)
                 }
             },

             { header: '보증금',name: 'deposit_amt',width: 100, align: 'right',sortable: true,
                 formatter: function (e) {
                     return ufn_comma(e.value)
                 }
             },
             { header: '월세',name: 'rent_amt',width: 100, align: 'right',sortable: true,
                 formatter: function (e) {
                     return ufn_comma(e.value)
                 }
             },

           ],
           columnOptions: {
             resizable: true
           }
         });

         grid.on('click',(ev)=>{
             if (ev.targetType === 'cell' && ev.columnName === 'address') {
                 const rowIndex = ev.rowKey;
                 const row = grid.getRow(rowIndex);

                 openMap(row.address);
             }

             if (ev.targetType === 'cell' && ev.columnName === 'detail') {
                 const rowIndex = ev.rowKey;
                 const row = grid.getRow(rowIndex);

                 openDetail(row.seq);
             }

             if (ev.targetType === 'cell' && ev.columnName === 'confirm') {

                 const rowIndex = ev.rowKey;
                 const row = grid.getRow(rowIndex);
                 if(row.appr_stat == '999'){
                     return false;
                 }else if(row.appr_stat == '4'){
                    var vHtml = "";
                    vHtml += "<h3 class='text-center text-danger'>반려사유</h3>";
                    vHtml += "<p class='pt-2'>"+row.reject+"</p>";
                    MsgBox.Alert(vHtml);
                    return false;
                 }else{
                     openApproval(row.appr_no);
                 }
             }

             if (ev.targetType === 'cell' && ev.columnName === 'docu_file') {
                 const rowIndex = ev.rowKey;
                 const row = grid.getRow(rowIndex);
                 if(row.fn_tg == 'F'){
                     return false;
                 }else{
                     btnDocContractDown(row.seq);
                 }
             }

             if (ev.targetType === 'cell' && ev.columnName === 'rewrite') {
                 const rowIndex = ev.rowKey;
                 const row = grid.getRow(rowIndex);
                 
                 // rewrite 값이 'Y'인 경우 클릭 이벤트 처리하지 않음
                 if(row.rewrite === 'Y'){
                     return false;
                 }
                 
                 MsgBox.Confirm("재작성하시겠습니까?", function() {
                     // 재작성 로직 - edit.html로 이동
                     var options = "toolbar=no,scrollbars=no,resizable=yes,status=no,menubar=no,width=1200, height=900, top=10,left=100";
                     window.open("/rewrite?seq=" + row.seq, 'rewrite', options);
                 });
             }
         });

         grid.on('dblclick', (ev) => {
             //console.log(ev.rowKey+"//"+ev.columnName);
             //var vData = grid.getValue(ev.rowKey, ev.columnName);
             //console.log(vData);
         });

         grid.on('check', (ev) => {
           var appr_stat = grid.getValue(ev.rowKey, "appr_stat");

           if(appr_stat != '999'){
             MsgBox.Alert("*결재가 진행중인 건은 선택이 불가합니다. ");
             grid.uncheck(ev.rowKey);
           }
         });

         grid.on('checkAll', () => {
             var checkedRows = grid.getCheckedRows();
             checkedRows.forEach((row, index) => {
                 if (row.appr_stat != '999') {
                     const rowIndex = grid.getIndexOfRow(row.rowKey);
                     grid.uncheck(rowIndex);
                 }
             });
         });



         $("#searchBtn").on("click",function(e){
             var confTag = $("#sel_conf_tag").val();
             
             // conf_tag가 2나 3일 경우 상세 열 숨기기
             if (confTag === "2" || confTag === "3") {
                 grid.hideColumn('detail');
             } else {
                 grid.showColumn('detail');
             }
             
             // conf_tag가 4일 경우 결제 열 숨기기, 반려사유 열 보이기, 체크박스 숨기고 재작성 열 보이기
             if (confTag === "4") {
                 grid.hideColumn('confirm');
                 grid.showColumn('reject');
                 grid.hideColumn('_checked');
                 grid.showColumn('rewrite');
             } else if (confTag === "999") {
                 // 999인 경우 결제 열 숨기기
                 grid.hideColumn('confirm');
                 grid.hideColumn('reject');
                 grid.showColumn('_checked');
                 grid.hideColumn('rewrite');
             } else {
                 // 2, 3인 경우 체크박스 숨기기
                 grid.showColumn('confirm');
                 grid.hideColumn('reject');
                 grid.hideColumn('_checked');
                 grid.hideColumn('rewrite');
             }
             
             // conf_tag가 2, 3, 4인 경우 확인요청, 삭제 버튼 숨기기
             if (confTag === "2" || confTag === "3" || confTag === "4") {
                 $("#btnApproval").hide();
                 $("#btnStatDelete").hide();
             } else {
                 $("#btnApproval").show();
                 $("#btnStatDelete").show();
             }
             
             G_load(grid,"/api/cont_list","search_form");
         });


         function openMap(searchTxt){
             var options = "toolbar=no,scrollbars=no,resizable=yes,status=no,menubar=no,width=1200, height=900, top=10,left=100";
             window.open("https://map.naver.com/p/search/"+searchTxt, 'docu',options);
         }

         function openDetail(seq){
             var options = "toolbar=no,scrollbars=no,resizable=yes,status=no,menubar=no,width=1200, height=900, top=10,left=100";
             window.open("/detail?seq="+seq, 'docu',options);
         }

         function openApproval(appr_no){

            var options = "toolbar=no,scrollbars=no,resizable=yes,status=no,menubar=no,width=1200, height=900, top=10,left=100";
             window.open("/appr/reg/"+appr_no,"approval", options);

         }

         // 실제 승인 요청을 처리하는 함수
         function processApprovalRequest(rowDataArray, chkProjCode, apprEmpNo) {
             var confirmMessage = "*선택된 "+rowDataArray.length+"건을 확인요청 하시겠습니까?";
             
             // 본인을 선택한 경우 경고 메시지 추가
             if(apprEmpNo === "0") {
                 confirmMessage += "<br><br><strong style='color: #dc3545;'>현장소장이 없는 경우에만 본인 선택이 가능합니다.<br>그렇지 않은 경우 해당 요청은 반려될 수 있습니다.</strong>";
             }
             
             MsgBox.Confirm(confirmMessage, function() {
                 $.ajax({
                   url: '/appr/multi/apply',
                   type: 'POST',
                   contentType: 'application/json',
                   data: JSON.stringify({ arrayList: rowDataArray, proj_code: chkProjCode, appr_emp_no: apprEmpNo }),
                   success: function(response) {
                     console.log('데이터 전송 성공:', response);
                     G_load(grid,"/api/cont_list/"+$("#sel_proj").val(),"search_form");
                   },
                   error: function(error) {
                     console.error('데이터 전송 실패:', error);
                   }
                 });
             });
         }

         //묶음결재
         $("#btnApproval").on("click",async function(){

             var checkedRows = grid.getCheckedRows();
             var chkProjCode = "";
             var rowDataArray = [];

             if(checkedRows.length == 0){
                 MsgBox.Alert("*선택된 데이터가 없습니다.");
                 return false;
             }

             for(let index = 0 ; index < checkedRows.length; index++ ){
                 let row = checkedRows[index];
                 if(index == 0){
                     chkProjCode = row.proj_code;
                 }
                 if(row.proj_code != chkProjCode){
                     const rowIndex = grid.getIndexOfRow(row.rowKey);
                     grid.uncheck(rowIndex);
                     MsgBox.Alert("*동일 현장만 묶음결재가 가능합니다.");
                     return false;
                 }
                 rowDataArray.push(row.seq);
             }

             $("#appr_popup").modal("show");

             $("#appr_confirm_yes").on("click",function(){

                let apprEmpNo = $("#sel_confirm_user").val();
                
                // 확인자 선택 유효성 검사
                if (!apprEmpNo || apprEmpNo === "") {
                    MsgBox.Alert("*확인자를 선택해주세요.");
                    return false;
                }
                
                // 실제 요청 처리 (본인 선택 여부에 따라 메시지가 달라짐)
                processApprovalRequest(rowDataArray, chkProjCode, apprEmpNo);

                 $("#appr_popup").modal("hide");

             });

             $("#appr_confirm_no").on("click",function(){
                $("#appr_popup").modal("hide");
             });

         });

            function init() {
                var confTag = $("#sel_conf_tag").val();
                
                // conf_tag가 2나 3일 경우 상세 열 숨기기
                if (confTag === "2" || confTag === "3") {
                    grid.hideColumn('detail');
                } else {
                    grid.showColumn('detail');
                }
                
                // conf_tag가 4일 경우 결제 열 숨기기, 반려사유 열 보이기, 체크박스 숨기고 재작성 열 보이기
                if (confTag === "4") {
                    grid.hideColumn('confirm');
                    grid.showColumn('reject');
                    grid.hideColumn('_checked');
                    grid.showColumn('rewrite');
                } else if (confTag === "999") {
                    // 999인 경우 결제 열 숨기기
                    grid.hideColumn('confirm');
                    grid.hideColumn('reject');
                    grid.showColumn('_checked');
                    grid.hideColumn('rewrite');
                } else {
                    // 2, 3인 경우 체크박스 숨기기
                    grid.showColumn('confirm');
                    grid.hideColumn('reject');
                    grid.hideColumn('_checked');
                    grid.hideColumn('rewrite');
                }
                
                // conf_tag가 2, 3, 4인 경우 확인요청, 삭제 버튼 숨기기
                if (confTag === "2" || confTag === "3" || confTag === "4") {
                    $("#btnApproval").hide();
                    $("#btnStatDelete").hide();
                } else {
                    $("#btnApproval").show();
                    $("#btnStatDelete").show();
                }
                
                G_load(grid,"/api/cont_list","search_form");
            }

         document.addEventListener('DOMContentLoaded', init);

         // 삭제 버튼 클릭 이벤트
         $("#btnStatDelete").on("click", function() {
             const checkedRows = grid.getCheckedRows();
             if (checkedRows.length === 0) {
                 MsgBox.Alert("삭제할 항목을 선택해주세요.");
                 return;
             }

             MsgBox.Confirm("선택한 계약을 삭제하시겠습니까?", function() {
                 const seqList = checkedRows.map(row => row.seq);

                 $.ajax({
                     url: '/api/cont/delete',
                     type: 'POST',
                     contentType: 'application/json',
                     data: JSON.stringify({ seqList: seqList }),
                     success: function(response) {
                         if (response.success) {
                             MsgBox.Alert(response.message);
                             G_load(grid,"/api/cont_list","search_form");
                         } else {
                             MsgBox.Alert(response.message);
                         }
                     },
                     error: function(xhr, status, error) {
                         MsgBox.Alert("계약 삭제 중 오류가 발생했습니다.");
                         console.error('Delete error:', error);
                     }
                 });
             });
         });

    </script>
</body>
</html>
