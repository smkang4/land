<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>부동산 임차관리 플랫폼</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
</head>
<body class="login-page">
    <div class="login-shell">
        <aside class="login-hero" aria-label="브랜드">
            <div class="login-hero__glow" aria-hidden="true"></div>
            <div class="login-hero__inner">
                <p class="login-hero__top">Dong-Ah Geological Engineering</p>

                <div class="login-hero__brand-block">
                    <div class="login-hero__brand-row">
                        <img th:src="@{/images/dongah.gif}" alt="" class="login-hero__logo" width="40" height="32">
                        <span class="login-hero__org">동아지질</span>
                    </div>
                    <h1 class="login-hero__title text-balance">부동산 임차관리 플랫폼</h1>
                </div>

                <div class="login-hero__foot">
                    <p class="login-hero__notice">본 시스템은 동아지질 임직원만 이용할 수 있습니다.</p>
                    <p class="login-hero__meta">문의 · 업무지원팀 강성민 매니저 [ 내선 5534 ]</p>
                </div>
            </div>
        </aside>

        <section class="login-form-pane">
            <div class="login-form-card">
                <header class="login-form-card__head">
                    <h2 class="login-form-card__title">로그인</h2>
                    <p class="login-form-card__sub">ERP 계정으로 접속하세요</p>
                </header>
                <form th:action="@{/login}" method="post" class="login-form">
                    <div class="mb-3">
                        <label for="userId" class="form-label">아이디</label>
                        <input type="text" class="form-control" id="userId" name="userId"
                               placeholder="아이디" required autocomplete="username">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">비밀번호</label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="비밀번호" required autocomplete="current-password">
                    </div>
                    <div th:if="${param.error}" class="alert alert-danger" role="alert">
                        아이디 혹은 비밀번호가 맞지 않습니다.
                    </div>
                    <button class="w-100 btn btn-lg btn-primary login-form__submit" type="submit">로그인</button>
                </form>
            </div>
        </section>
    </div>
</body>
</html>
