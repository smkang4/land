<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/spoqa-han-sans@2.1.2/css/SpoqaHanSansNeo.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>부동산 임차관리 플랫폼</title>
    <style>
        @charset "UTF-8";
        html, body {
            height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Spoqa Han Sans Neo', 'sans-serif';
        }

        .container {
            max-width: 400px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-header {
            background: linear-gradient(45deg, rgba(13, 110, 253, 0.9), rgba(10, 88, 202, 0.9));
            color: white;
            padding: 1.5rem;
            border: none;
            border-radius: 15px 15px 0 0;
        }

        .card-body {
            padding: 2rem;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }

        .btn-primary {
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            background: linear-gradient(45deg, #0d6efd, #0a58ca);
            border: none;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(13, 110, 253, 0.3);
        }

        .logo {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .alert {
            border-radius: 10px;
            border: none;
            background-color: #fff3f3;
            color: #dc3545;
        }

        .form-label {
            font-weight: 600;
            color: #495057;
        }

        /* ������ ������ */
        @media (min-width: 1200px) {
            .container {
                max-width: 400px;
                margin-top: 50px;
            }
        }

        @media (min-width: 992px) and (max-width: 1199px) {
            .container {
                max-width: 400px;
                margin-top: 40px;
            }
        }

        @media (min-width: 768px) and (max-width: 991px) {
            .container {
                max-width: 400px;
                margin-top: 60px;
            }
        }

        @media (max-width: 767px) {
            .container {
                padding: 0 20px;
            }
            
            .card {
                margin-bottom: 20px;
            }
            
            .form-control {
                padding: 10px;
            }
            
            .btn-primary {
                padding: 10px;
            }
            
            .logo {
                width: 60px;
                height: 47px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-body">
                <div class="text-center mb-4">
                    <img class="mb-4 logo" src="/images/dongah.gif" alt="" width="72" height="57">
                    <h1 class="h3 mb-3 fw-bold">동아지질</h1>
                    <h1 class="h4 mb-4">부동산 임차관리 플랫폼</h1>
                </div>
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="userId" class="form-label">아이디</label>
                        <input type="text" class="form-control" id="userId" name="userId" placeholder="아이디를 입력하세요" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">비밀번호</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
                    </div>
                    <div th:if="${param.error}" class="alert alert-danger">
                        아이디 혹은 비밀번호가 맞지 않습니다.
                    </div>
                    <button class="w-100 btn btn-lg btn-primary" type="submit">로그인</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
