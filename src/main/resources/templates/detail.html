<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: headFragment('계약서 상세', null)}"></th:block>
    <link rel="stylesheet" th:href="@{/css/detail.css}">
    <link rel="stylesheet" th:href="@{/css/doc-desk.css}">
</head>
<body class="app-shell--quiet">
    <main class="doc-desk">
    <div class="detail-container" th:each="detail : ${contract}">
        <div class="d-flex justify-content-end mb-2"
             th:if="${#authentication.principal.userNo.toString() == detail.emp_no
                      and detail.appr_no == null and flag == 'Y'}">
            <button type="button" class="btn edit-button"
                    th:attr="data-seq=${detail.seq}" onclick="edit(this.getAttribute('data-seq'))">
                <i class="bi bi-pencil-square me-1"></i>
                수정하기
            </button>
        </div>
        <div class="detail-card">
            <div class="detail-header">
                <h2 class="detail-title" th:text="${detail.proj_name}">프로젝트명</h2>
                <div class="detail-info">
                    <span><i class="bi bi-person"></i> <span th:text="${detail.user_nm}">작성자</span></span>
                    <span><i class="bi bi-calendar"></i> <span th:text="${detail.crtdate}">작성일</span></span>
                </div>
            </div>

            <div class="detail-content">
                <!-- 상단 좌우 레이아웃 -->
                <div class="row g-3 mb-3">
                    <!-- 왼쪽: 기본정보 -->
                    <div class="col-md-6">
                        <div class="detail-section h-100">
                            <h3 class="detail-section-title"><i class="bi bi-info-circle"></i> 물건정보</h3>
                            <div class="row g-2">
                                <div class="col-12">
                                    <div class="detail-item">
                                        <div class="detail-label">주소</div>
                                        <div class="detail-value" th:text="${detail.address}">-</div>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="detail-item">
                                        <div class="detail-label">상세주소</div>
                                        <div class="detail-value" th:text="${detail.address_d}">-</div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="detail-item">
                                        <div class="detail-label">계약일</div>
                                        <div class="detail-value" th:text="${detail.cont_date}">-</div>
                                    </div>
                                </div>
                                <div class="col-md-6" th:if="${detail.cont_period != null and detail.cont_period != ''}">
                                    <div class="detail-item">
                                        <div class="detail-label">계약기간</div>
                                        <div class="detail-value" th:text="${detail.cont_period + '개월'}">-</div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="detail-item">
                                        <div class="detail-label">이사일</div>
                                        <div class="detail-value" th:text="${detail.move_date}">-</div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="detail-item">
                                        <div class="detail-label">보증금</div>
                                        <div class="detail-value amount" th:text="${#numbers.formatInteger(detail.deposit_amt, 3, 'COMMA') + '만원'}">-</div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="detail-item">
                                        <div class="detail-label">월세</div>
                                        <div class="detail-value amount" th:text="${detail.rent_amt + '만원'}">-</div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="detail-item">
                                        <div class="detail-label">주거유형</div>
                                        <div class="detail-value" th:text="${detail.res_type}">-</div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="detail-item">
                                        <div class="detail-label">거래유형</div>
                                        <div class="detail-value" th:text="${detail.trans_type}">-</div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="detail-item">
                                        <div class="detail-label">면적</div>
                                        <div class="detail-value" th:text="${detail.area + '㎡ (' + areaInPyeong + '평)'}">-</div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="detail-item">
                                        <div class="detail-label">사용인원</div>
                                        <div class="detail-value" th:text="${detail.accu}">-</div>
                                    </div>
                                </div>
                                <div class="col-md-6" th:if="${detail.accu_type != null and detail.accu_type != ''}">
                                    <div class="detail-item">
                                        <div class="detail-label">인원유형</div>
                                        <div class="detail-value" th:text="${detail.accu_type}">-</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                            </div>
                            <div class="detail-item">

                    <!-- 오른쪽: 체크리스트 -->
                    <div class="col-md-6">
                        <div class="detail-section h-100">
                            <h3 class="detail-section-title"><i class="bi bi-check2-square"></i> 체크리스트</h3>
                            <div th:replace="~{fragments/checklist :: surveyChecklist(${detail})}"></div>
                        </div>
                    </div>
                </div>


                <!-- 하단: 첨부파일 -->
                <div class="row g-3">
                    <div class="col-12">
                        <div class="detail-section">
                            <h3 class="detail-section-title"><i class="bi bi-paperclip"></i> 첨부파일</h3>
                            <div class="row g-3">
                                <!-- 부동산정보 파일 섹션 -->
                                <div class="col-md-6">
                                    <div class="file-section h-100">
                                        <h6 class="file-section-title mb-2">
                                            <i class="bi bi-building"></i> 공인중개 관련
                                            <small class="text-muted ms-2">(부동산명함 및 정보)</small>
                                        </h6>
                                        <div class="file-list" th:if="${detail.realEstateFileList != null and !detail.realEstateFileList.isEmpty()}">
                                            <div class="list-group">
                                                <div class="list-group-item" th:each="file : ${detail.realEstateFileList}">
                                                    <div class="d-flex align-items-center justify-content-between">
                                                        <div class="file-info">
                                                            <i class="bi bi-file-earmark-text file-icon"></i>
                                                            <span class="file-name" th:text="${file.originalFilename}">파일명</span>
                                                        </div>
                                                        <a th:href="@{'/api/download-file/' + ${file.id}}" 
                                                           class="btn btn-sm btn-outline-primary"
                                                           th:download="${file.originalFilename}"
                                                           target="_blank">
                                                            <i class="bi bi-download"></i> 다운로드
                                                        </a>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="file-list" th:if="${(detail.realEstateFileList == null or detail.realEstateFileList.isEmpty()) and detail.real_estate_files != null and detail.real_estate_files != ''}">
                                            <div class="list-group">
                                                <div class="list-group-item" th:each="fileId : ${#strings.arraySplit(detail.real_estate_files, ';')}">
                                                    <div class="d-flex align-items-center justify-content-between">
                                                        <div class="file-info">
                                                            <i class="bi bi-file-earmark-text file-icon"></i>
                                                            <span class="file-name" th:text="${fileId}">파일명</span>
                                                        </div>
                                                        <a th:href="@{'/api/download-file/' + ${fileId}}" class="btn btn-sm btn-outline-primary" th:download="${fileId}" target="_blank">
                                                            <i class="bi bi-download"></i> 다운로드
                                                        </a>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="no-files text-muted" th:unless="${(detail.realEstateFileList != null and !detail.realEstateFileList.isEmpty()) or (detail.real_estate_files != null and detail.real_estate_files != '')}">
                                            첨부된 파일이 없습니다.
                                        </div>
                                    </div>
                                </div>

                                <!-- 등기부등본 파일 섹션 -->
                                <div class="col-md-6">
                                    <div class="file-section h-100">
                                        <h6 class="file-section-title mb-2">
                                            <i class="bi bi-file-earmark-text"></i> 등기부등본
                                            <small class="text-muted ms-2">(채권순위 확인)</small>
                                        </h6>
                                        <div class="file-list" th:if="${detail.creditFileList != null and !detail.creditFileList.isEmpty()}">
                                            <div class="list-group">
                                                <div class="list-group-item" th:each="file : ${detail.creditFileList}">
                                                    <div class="d-flex align-items-center justify-content-between">
                                                        <div class="file-info">
                                                            <i class="bi bi-file-earmark-text file-icon"></i>
                                                            <span class="file-name" th:text="${file.originalFilename}">파일명</span>
                                                        </div>
                                                        <a th:href="@{'/api/download-file/' + ${file.id}}" class="btn btn-sm btn-outline-primary" th:download="${file.originalFilename}" target="_blank">
                                                            <i class="bi bi-download"></i> 다운로드
                                                        </a>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="file-list" th:if="${(detail.creditFileList == null or detail.creditFileList.isEmpty()) and detail.credit_files != null and detail.credit_files != ''}">
                                            <div class="list-group">
                                                <div class="list-group-item" th:each="fileId : ${#strings.arraySplit(detail.credit_files, ';')}">
                                                    <div class="d-flex align-items-center justify-content-between">
                                                        <div class="file-info">
                                                            <i class="bi bi-file-earmark-text file-icon"></i>
                                                            <span class="file-name" th:text="${fileId}">파일명</span>
                                                        </div>
                                                        <a th:href="@{'/api/download-file/' + ${fileId}}" class="btn btn-sm btn-outline-primary" th:download="${fileId}" target="_blank">
                                                            <i class="bi bi-download"></i> 다운로드
                                                        </a>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="no-files text-muted" th:unless="${(detail.creditFileList != null and !detail.creditFileList.isEmpty()) or (detail.credit_files != null and detail.credit_files != '')}">
                                            첨부된 파일이 없습니다.
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </main>

    <!-- 반려 사유 입력 모달 -->
    <div class="modal fade rejection-modal" id="rejectionModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">반려 사유 입력</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>반려 사유를 입력해주세요.</p>
                    <textarea id="rejectionReason" class="rejection-reason" rows="4" placeholder="반려 사유를 입력하세요..."></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-danger" onclick="rejectcontract()">반려하기</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function approvecontract() {
            if (confirm('이 계약서를 승인하시겠습니까?')) {
                const seq = new URLSearchParams(window.location.search).get('seq');
                $.ajax({
                    url: '/api/approve-contract',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ seq: seq }),
                    success: function(response) {
                        if (response.success) {
                            alert('계약서가 승인되었습니다.');
                            window.location.reload();
                        } else {
                            alert('승인 처리 중 오류가 발생했습니다.');
                        }
                    },
                    error: function() {
                        alert('서버 통신 중 오류가 발생했습니다.');
                    }
                });
            }
        }

        function showRejectionModal() {
            const modal = new bootstrap.Modal(document.getElementById('rejectionModal'));
            modal.show();
        }

        function rejectdetail() {
            const reason = document.getElementById('rejectionReason').value.trim();
            if (!reason) {
                alert('반려 사유를 입력해주세요.');
                return;
            }

            const seq = new URLSearchParams(window.location.search).get('seq');
            $.ajax({
                url: '/api/reject-detail',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ 
                    seq: seq,
                    reason: reason
                }),
                success: function(response) {
                    if (response.success) {
                        alert('계약서가 반려되었습니다.');
                        window.location.reload();
                    } else {
                        alert('반려 처리 중 오류가 발생했습니다.');
                    }
                },
                error: function() {
                    alert('서버 통신 중 오류가 발생했습니다.');
                }
            });
        }

        function edit(seq){
            window.location.href = "/edit?seq=" + seq;
        }
    </script>
</body>
</html>
