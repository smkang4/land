<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: headFragment('계약서 상세', null)}"></th:block>
    <link rel="stylesheet" th:href="@{/css/detail.css}">
    <link rel="stylesheet" th:href="@{/css/doc-desk.css}">
</head>
<body class="app-shell--quiet">
<main class="doc-desk">
    <section class="doc-desk__panel doc-desk__panel--appr">
        <div class="appr-chain appr-chain--center" role="list" aria-label="결재선">
            <div class="appr-chain__step"
                 role="listitem"
                 th:each="list, stat : ${appr_list}"
                 th:classappend="${list.appr_tg == 'T' ? 'is-ok' : (list.appr_tg == 'F' ? 'is-reject' : (list.appr_tg == 'N' ? 'is-wait' : ''))}">
                <div class="appr-chain__card">
                    <div class="appr-chain__top">
                        <p class="appr-chain__role" th:text="${list.appr_position}">직책</p>
                    </div>
                    <div class="appr-chain__mid">
                        <p class="appr-chain__name" th:text="${list.appr_emp_nm}">결재자</p>
                        <span class="appr-chain__state" th:text="${list.appr_tg_nm}">상태</span>
                    </div>
                    <div class="appr-chain__bottom">
                        <p class="appr-chain__date">
                            <span class="dt" th:if="${list.appr_tg} == T" th:text="${list.appr_date}"></span>
                            <span th:unless="${list.appr_tg} == T">대기 중</span>
                        </p>
                    </div>
                </div>
                <div class="appr-chain__arrow" aria-hidden="true" th:unless="${stat.last}">
                    <i class="bi bi-chevron-right"></i>
                </div>
            </div>
        </div>

        <div class="appr-remarks"
             th:if="${appr_list != null and !#lists.isEmpty(appr_list.?[appr_remarks != null and appr_remarks != ''])}">
            <div class="appr-remarks__title">결재 의견</div>
            <div class="appr-remarks__list">
                <article class="appr-remark-item"
                     th:each="list : ${appr_list}"
                     th:if="${list.appr_remarks != null and list.appr_remarks != ''}">
                    <div class="appr-remark__avatar" aria-hidden="true"
                         th:text="${list.appr_emp_nm != null and !#strings.isEmpty(list.appr_emp_nm) ? #strings.substring(list.appr_emp_nm,0,1) : '·'}">·</div>
                    <div class="appr-remark__main">
                        <div class="appr-remark-head">
                            <div class="appr-remark__who">
                                <span class="appr-remark-name" th:text="${list.appr_emp_nm}">결재자</span>
                                <span class="appr-remark__role" th:if="${list.appr_position != null and list.appr_position != ''}"
                                      th:text="${list.appr_position}">직책</span>
                            </div>
                            <a href="#" class="appr-remark__edit btn-edit-my-remark"
                               th:if="${login_emp_no != null and login_emp_no > 0 and list.appr_emp_no == login_emp_no}"
                               th:attr="data-d-seq=${list.d_seq}">수정</a>
                        </div>
                        <p class="appr-remark-text" th:text="${list.appr_remarks}"></p>
                    </div>
                </article>
            </div>
        </div>
    </section>

    <div class="detail-container" th:each="detail : ${contract}">
        <div class="detail-card">
            <div class="detail-header">
                <h2 class="detail-title" th:text="${detail.proj_name}">프로젝트명</h2>
                <div class="detail-info">
                    <span><i class="bi bi-person"></i> <span th:text="${detail.user_nm}">작성자</span></span>
                    <span><i class="bi bi-calendar"></i> <span th:text="${detail.crtdate}">작성일</span></span>
                </div>
            </div>

            <div class="detail-content">
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <div class="detail-section h-100">
                            <h3 class="detail-section-title"><i class="bi bi-info-circle"></i> 물건정보</h3>
                            <div class="row g-2">
                                <div class="col-12">
                                    <div class="detail-item">
                                        <div class="detail-label">주소</div>
                                        <div class="detail-value" th:text="${detail.address}">-</div>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="detail-item">
                                        <div class="detail-label">상세주소</div>
                                        <div class="detail-value" th:text="${detail.address_d}">-</div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="detail-item">
                                        <div class="detail-label">계약일</div>
                                        <div class="detail-value" th:text="${detail.cont_date}">-</div>
                                    </div>
                                </div>
                                <div class="col-md-6" th:if="${detail.cont_period != null and detail.cont_period != ''}">
                                    <div class="detail-item">
                                        <div class="detail-label">계약기간</div>
                                        <div class="detail-value" th:text="${detail.cont_period + '개월'}">-</div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="detail-item">
                                        <div class="detail-label">이사일</div>
                                        <div class="detail-value" th:text="${detail.move_date}">-</div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="detail-item">
                                        <div class="detail-label">보증금</div>
                                        <div class="detail-value amount" th:text="${#numbers.formatInteger(detail.deposit_amt, 3, 'COMMA') + '만원'}">-</div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="detail-item">
                                        <div class="detail-label">월세</div>
                                        <div class="detail-value amount" th:text="${detail.rent_amt + '만원'}">-</div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="detail-item">
                                        <div class="detail-label">주거유형</div>
                                        <div class="detail-value" th:text="${detail.res_type}">-</div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="detail-item">
                                        <div class="detail-label">거래유형</div>
                                        <div class="detail-value" th:text="${detail.trans_type}">-</div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="detail-item">
                                        <div class="detail-label">면적</div>
                                        <div class="detail-value" th:text="${detail.area + '㎡' + (areaInPyeong != null ? ' (' + areaInPyeong + '평)' : '')}">-</div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="detail-item">
                                        <div class="detail-label">사용인원</div>
                                        <div class="detail-value" th:text="${detail.accu}">-</div>
                                    </div>
                                </div>
                                <div class="col-md-6" th:if="${detail.accu_type != null and detail.accu_type != ''}">
                                    <div class="detail-item">
                                        <div class="detail-label">인원유형</div>
                                        <div class="detail-value" th:text="${detail.accu_type}">-</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="detail-section h-100">
                            <h3 class="detail-section-title"><i class="bi bi-check2-square"></i> 체크리스트</h3>
                            <div th:replace="~{fragments/checklist :: surveyChecklist(${detail})}"></div>
                        </div>
                    </div>
                </div>

                <div class="row g-3">
                    <div class="col-12">
                        <div class="detail-section">
                            <h3 class="detail-section-title"><i class="bi bi-paperclip"></i> 첨부파일</h3>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <div class="file-section h-100">
                                        <h6 class="file-section-title mb-2">
                                            <i class="bi bi-building"></i> 공인중개 관련
                                            <small class="text-muted ms-2">(부동산명함 및 정보)</small>
                                        </h6>
                                        <div class="file-list" th:if="${detail.realEstateFileList != null and !detail.realEstateFileList.isEmpty()}">
                                            <div class="list-group">
                                                <div class="list-group-item" th:each="file : ${detail.realEstateFileList}">
                                                    <div class="d-flex align-items-center justify-content-between">
                                                        <div class="file-info">
                                                            <i class="bi bi-file-earmark-text file-icon"></i>
                                                            <span class="file-name" th:text="${file.originalFilename}">파일명</span>
                                                        </div>
                                                        <a th:href="@{'/api/download-file/' + ${file.id}}" class="btn btn-sm btn-outline-primary download-btn" th:download="${file.originalFilename}" th:data-file-id="${file.id}" th:data-file-name="${file.originalFilename}" target="_blank">
                                                            <i class="bi bi-download"></i> 다운로드
                                                        </a>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="file-list" th:if="${(detail.realEstateFileList == null or detail.realEstateFileList.isEmpty()) and detail.real_estate_files != null and detail.real_estate_files != ''}">
                                            <div class="list-group">
                                                <div class="list-group-item" th:each="fileId : ${#strings.arraySplit(detail.real_estate_files, ';')}">
                                                    <div class="d-flex align-items-center justify-content-between">
                                                        <div class="file-info">
                                                            <i class="bi bi-file-earmark-text file-icon"></i>
                                                            <span class="file-name" th:text="${fileId}">파일명</span>
                                                        </div>
                                                        <a th:href="@{'/api/download-file/' + ${fileId}}" class="btn btn-sm btn-outline-primary download-btn" th:download="${fileId}" th:data-file-id="${fileId}" th:data-file-name="${fileId}" target="_blank">
                                                            <i class="bi bi-download"></i> 다운로드
                                                        </a>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="no-files text-muted" th:unless="${(detail.realEstateFileList != null and !detail.realEstateFileList.isEmpty()) or (detail.real_estate_files != null and detail.real_estate_files != '')}">
                                            첨부된 파일이 없습니다.
                                        </div>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <div class="file-section h-100">
                                        <h6 class="file-section-title mb-2">
                                            <i class="bi bi-file-earmark-text"></i> 등기부등본
                                            <small class="text-muted ms-2">(채권순위 확인)</small>
                                        </h6>
                                        <div class="file-list" th:if="${detail.creditFileList != null and !detail.creditFileList.isEmpty()}">
                                            <div class="list-group">
                                                <div class="list-group-item" th:each="file : ${detail.creditFileList}">
                                                    <div class="d-flex align-items-center justify-content-between">
                                                        <div class="file-info">
                                                            <i class="bi bi-file-earmark-text file-icon"></i>
                                                            <span class="file-name" th:text="${file.originalFilename}">파일명</span>
                                                        </div>
                                                        <a th:href="@{'/api/download-file/' + ${file.id}}" class="btn btn-sm btn-outline-primary download-btn" th:download="${file.originalFilename}" th:data-file-id="${file.id}" th:data-file-name="${file.originalFilename}" target="_blank">
                                                            <i class="bi bi-download"></i> 다운로드
                                                        </a>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="file-list" th:if="${(detail.creditFileList == null or detail.creditFileList.isEmpty()) and detail.credit_files != null and detail.credit_files != ''}">
                                            <div class="list-group">
                                                <div class="list-group-item" th:each="fileId : ${#strings.arraySplit(detail.credit_files, ';')}">
                                                    <div class="d-flex align-items-center justify-content-between">
                                                        <div class="file-info">
                                                            <i class="bi bi-file-earmark-text file-icon"></i>
                                                            <span class="file-name" th:text="${fileId}">파일명</span>
                                                        </div>
                                                        <a th:href="@{'/api/download-file/' + ${fileId}}" class="btn btn-sm btn-outline-primary download-btn" th:download="${fileId}" th:data-file-id="${fileId}" th:data-file-name="${fileId}" target="_blank">
                                                            <i class="bi bi-download"></i> 다운로드
                                                        </a>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="no-files text-muted" th:unless="${(detail.creditFileList != null and !detail.creditFileList.isEmpty()) or (detail.credit_files != null and detail.credit_files != '')}">
                                            첨부된 파일이 없습니다.
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div class="modal fade" id="editRemarkModal" tabindex="-1" aria-labelledby="editRemarkModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editRemarkModalLabel">결재 의견 수정</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editRemarkDSeq" value="">
                <label for="editRemarkText" class="form-label small text-muted">의견</label>
                <textarea class="form-control" id="editRemarkText" rows="5" style="white-space: pre-wrap;"></textarea>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                <button type="button" class="btn btn-primary" id="btnSaveRemarkEdit">저장</button>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    var viewApprNo = /*[[${appr_no}]]*/ 0;
</script>
<script>
    $(document).on('click', 'a.btn-edit-my-remark', function (e) {
        e.preventDefault();
        var dseq = $(this).data('d-seq');
        var text = $(this).closest('.appr-remark-item').find('.appr-remark-text').text();
        $('#editRemarkDSeq').val(dseq);
        $('#editRemarkText').val(text);
        var modal = new bootstrap.Modal(document.getElementById('editRemarkModal'));
        modal.show();
    });

    $('#btnSaveRemarkEdit').on('click', function () {
        var dseq = $('#editRemarkDSeq').val();
        var body = new URLSearchParams();
        body.set('appr_no', String(viewApprNo));
        body.set('d_seq', String(dseq));
        body.set('appr_remarks', $('#editRemarkText').val());
        $('#btnSaveRemarkEdit').prop('disabled', true);
        fetch('/appr/update/remarks', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: body.toString()
        }).then(function (res) {
            return res.text().then(function (text) {
                try {
                    return { ok: res.ok, json: JSON.parse(text) };
                } catch (e) {
                    return { ok: false, json: { message: '응답을 처리할 수 없습니다.' } };
                }
            });
        }).then(function (result) {
            $('#btnSaveRemarkEdit').prop('disabled', false);
            if (result.ok && result.json && result.json.success) {
                var inst = bootstrap.Modal.getInstance(document.getElementById('editRemarkModal'));
                if (inst) { inst.hide(); }
                alert(result.json.message || '저장되었습니다.');
                location.reload();
            } else {
                alert((result.json && result.json.message) ? result.json.message : '저장에 실패했습니다.');
            }
        }).catch(function () {
            $('#btnSaveRemarkEdit').prop('disabled', false);
            alert('의견 저장 중 오류가 발생했습니다.');
        });
    });

    $(document).ready(function() {
        $('.download-btn').on('click', function() {
            var $btn = $(this);
            $btn.html('<i class="bi bi-arrow-clockwise"></i> 다운로드 중...');
            $btn.prop('disabled', true);
            setTimeout(function() {
                $btn.html('<i class="bi bi-download"></i> 다운로드');
                $btn.prop('disabled', false);
            }, 3000);
        });
    });
</script>
</body>
</html>
