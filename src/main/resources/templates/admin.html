<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="~{fragments/head :: headFragment('관리자', 'grid')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/checkbox.css}">
    <link rel="stylesheet" th:href="@{/css/grid.css}">
    <link rel="stylesheet" th:href="@{/css/list-desk.css}">
    <link rel="stylesheet" th:href="@{/css/admin-desk.css}">
</head>
<body class="app-shell--quiet">

<th:block th:with="backUrl=@{/main}, backText='메인화면'">
    <div th:replace="~{fragments/header :: siteHeader}"></div>
</th:block>


<main class="list-desk admin-desk-page app-main">
    <div class="list-desk__shell">
        <header class="list-desk__head">
            <div class="list-desk__titles">
                <p class="list-desk__eyebrow">관리</p>
                <h1 class="list-desk__title text-balance">관리자</h1>
                <p class="list-desk__lead text-pretty">확인요청 진행 중인 사전조사서를 조회하고 ERP·거래처 등록을 처리합니다</p>
                <div class="admin-stats" role="group" aria-label="확인상태 필터">
                    <button type="button" class="admin-stat-btn is-active" data-stat-filter="all">
                        전체 <strong class="admin-stat__value" id="totalContracts">0</strong>
                    </button>
                    <button type="button" class="admin-stat-btn admin-stat-btn--pending" data-stat-filter="progress">
                        진행 <strong class="admin-stat__value" id="pendingContracts">0</strong>
                    </button>
                    <button type="button" class="admin-stat-btn admin-stat-btn--ok" data-stat-filter="approved">
                        승인 <strong class="admin-stat__value" id="approvedContracts">0</strong>
                    </button>
                    <button type="button" class="admin-stat-btn admin-stat-btn--reject" data-stat-filter="rejected">
                        반려 <strong class="admin-stat__value" id="rejectedContracts">0</strong>
                    </button>
                </div>
            </div>
            <div class="list-desk__actions">
                <button type="button" class="btn list-desk__btn list-desk__btn--danger" onclick="move(1);">
                    <i class="bi bi-inbox" aria-hidden="true"></i> 접수함
                </button>
                <button type="button" class="btn list-desk__btn list-desk__btn--danger" onclick="move(2);">
                    <i class="bi bi-clipboard-check" aria-hidden="true"></i> 결재함
                </button>
                <button type="button" class="btn btn-primary list-desk__btn" data-bs-toggle="modal" data-bs-target="#adminSettingsModal">
                    <i class="bi bi-gear" aria-hidden="true"></i> 관리자설정
                </button>
            </div>
        </header>

        <section class="list-desk__panel admin-desk">
            <ul class="nav admin-tabs" id="adminTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="search-tab" data-bs-toggle="tab" data-bs-target="#search-tab-pane" type="button" role="tab" aria-controls="search-tab-pane" aria-selected="true">
                        <i class="bi bi-search" aria-hidden="true"></i> 현장조회
                    </button>
                </li>
                <li class="nav-item" role="presentation" th:if="${showErpCustomerTabs}">
                    <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register-tab-pane" type="button" role="tab" aria-controls="register-tab-pane" aria-selected="false">
                        <i class="bi bi-plus-circle" aria-hidden="true"></i> ERP등록
                    </button>
                </li>
                <li class="nav-item" role="presentation" th:if="${showErpCustomerTabs}">
                    <button class="nav-link" id="customer-register-tab" data-bs-toggle="tab" data-bs-target="#customer-register-tab-pane" type="button" role="tab" aria-controls="customer-register-tab-pane" aria-selected="false">
                        <i class="bi bi-people" aria-hidden="true"></i> 거래처등록
                    </button>
                </li>
            </ul>

            <div class="tab-content admin-tab-body" id="adminTabsContent">
                <div class="tab-pane fade show active" id="search-tab-pane" role="tabpanel" aria-labelledby="search-tab" tabindex="0">
                    <form id="search_form" method="get" class="admin-filters">
                        <div class="list-desk__filter-field list-desk__filter-field--proj">
                            <label class="list-desk__label" for="con">현장</label>
                            <select id="con" name="proj_code" class="form-select" style="width:100%"></select>
                        </div>
                        <button type="button" class="btn btn-primary list-desk__btn" id="searchBtn" style="display:none" aria-hidden="true">조회</button>
                    </form>
                    <div class="admin-grid-wrap">
                        <div id="grid" class="list-desk__grid"></div>
                    </div>
                </div>

                <div class="tab-pane fade" id="register-tab-pane" role="tabpanel" aria-labelledby="register-tab" tabindex="0"
                     th:if="${showErpCustomerTabs}">
                    <p class="admin-hint">거래처 승인이 완료된 기안서를 ERP에 등록합니다.</p>
                    <div class="admin-toolbar">
                        <div class="admin-toolbar__left">
                            <button type="button" class="btn btn-primary list-desk__btn" id="erpSelectRegisterBtn" disabled>
                                <i class="bi bi-check-circle" aria-hidden="true"></i> 선택등록
                            </button>
                            <button type="button" class="btn list-desk__btn list-desk__btn--danger" id="erpAllRegisterBtn">
                                <i class="bi bi-check-all" aria-hidden="true"></i> 일괄등록
                            </button>
                        </div>
                        <p class="admin-toolbar__meta">선택 <strong id="erpSelectedCount">0</strong>개</p>
                    </div>
                    <div class="admin-danger-panel" th:if="${showDeleteFeature}">
                        <div class="admin-danger-panel__head">
                            <i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
                            ERP 등록 데이터 삭제 (테스트용)
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label for="erpDeleteSeqInput" class="form-label mb-0">삭제할 SEQ</label>
                            <span class="admin-count" id="erpDeleteSeqCount">0건</span>
                        </div>
                        <textarea class="form-control mb-2 font-monospace" id="erpDeleteSeqInput" rows="8"
                                  style="min-height: 140px; resize: vertical;"
                                  placeholder="엑셀에서 SEQ 열을 복사한 뒤 붙여넣기하세요."></textarea>
                        <div class="d-flex flex-wrap gap-2 justify-content-between">
                            <div class="d-flex flex-wrap gap-2">
                                <button type="button" class="btn btn-outline-secondary btn-sm" id="erpDeletePasteBtn">
                                    <i class="bi bi-clipboard"></i> 클립보드 붙여넣기
                                </button>
                                <button type="button" class="btn btn-outline-secondary btn-sm" id="erpDeleteClearBtn">
                                    <i class="bi bi-x-lg"></i> 비우기
                                </button>
                            </div>
                            <button type="button" class="btn btn-danger btn-sm" id="erpDeleteBtn">
                                <i class="bi bi-trash"></i> <span id="erpDeleteBtnLabel">삭제</span>
                            </button>
                        </div>
                        <small class="d-block mt-2">입력한 SEQ마다 ERP 등록 데이터가 삭제됩니다.</small>
                    </div>
                    <div class="admin-grid-wrap">
                        <div id="erpGrid" class="list-desk__grid"></div>
                    </div>
                </div>

                <div class="tab-pane fade" id="customer-register-tab-pane" role="tabpanel" aria-labelledby="customer-register-tab" tabindex="0"
                     th:if="${showErpCustomerTabs}">
                    <p class="admin-hint">승인 완료 기안서의 거래처를 ERP에 등록합니다.</p>
                    <div class="admin-toolbar">
                        <div class="admin-toolbar__left">
                            <button type="button" class="btn btn-primary list-desk__btn" id="customerSelectRegisterBtn" disabled>
                                <i class="bi bi-check-circle" aria-hidden="true"></i> 선택등록
                            </button>
                            <button type="button" class="btn list-desk__btn list-desk__btn--danger" id="customerAllRegisterBtn">
                                <i class="bi bi-check-all" aria-hidden="true"></i> 일괄등록
                            </button>
                        </div>
                        <p class="admin-toolbar__meta">선택 <strong id="customerSelectedCount">0</strong>개</p>
                    </div>
                    <div class="admin-grid-wrap">
                        <div id="customerGrid" class="list-desk__grid"></div>
                    </div>
                </div>
            </div>
        </section>
    </div>

        <!-- 관리자 설정 모달 -->
        <div class="modal fade" id="adminSettingsModal" tabindex="-1" aria-labelledby="adminSettingsModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <div class="d-flex align-items-center">
                            <div class="icon-wrapper me-3">
                                <i class="bi bi-gear-fill"></i>
                            </div>
                            <h5 class="modal-title" id="adminSettingsModalLabel">관리자 설정</h5>
                        </div>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="row g-4">
                            <div class="col-md-6">
                                <div class="admin-list-section">
                                    <div class="section-header">
                                        <div class="d-flex align-items-center">
                                            <div class="icon-wrapper me-2">
                                                <i class="bi bi-people-fill"></i>
                                            </div>
                                            <h6>현재 관리자 목록</h6>
                                        </div>
                                        <span class="admin-count">0명</span>
                                    </div>
                                    <div id="adminList" class="admin-list">
                                        <!-- 관리자 목록이 여기에 동적으로 로드됩니다 -->
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="admin-add-section">
                                    <div class="section-header">
                                        <div class="d-flex align-items-center">
                                            <div class="icon-wrapper me-2">
                                                <i class="bi bi-person-plus-fill"></i>
                                            </div>
                                            <h6>관리자 추가</h6>
                                        </div>
                                    </div>
                                    <div class="admin-add-content">
                                        <form id="addAdminForm">
                                            <div class="mb-3">
                                                <label class="form-label">직원 선택</label>
                                                <select class="form-select" id="employeeSelect" required>
                                                    <option value="">직원을 선택하세요</option>
                                                </select>
                                            </div>
                                            <div class="mb-3">
                                                <div class="d-flex align-items-center justify-content-between">
                                                    <label class="form-label mb-0">메일 수신</label>
                                                    <div class="mail-check-wrapper">
                                                        <label class="mail-check">
                                                            <input type="checkbox" id="mailReceiveCheck">
                                                            <span class="mail-check-slider"></span>
                                                        </label>
                                                        <span class="switch-status">미수신</span>
                                                    </div>
                                                </div>
                                            </div>
                                            <button type="submit" class="btn btn-primary w-100">
                                                <i class="bi bi-plus-circle me-2"></i>관리자 추가
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="notice-modal-setting mt-4 pt-3 border-top">
                            <div class="d-flex align-items-center justify-content-between">
                                <div>
                                    <h6 class="mb-1">메인 공지 모달 표시</h6>
                                    <p class="text-muted small mb-0">메인 페이지 기능 안내 모달을 사용자에게 표시합니다</p>
                                </div>
                                <div class="mail-check-wrapper">
                                    <label class="mail-check">
                                        <input type="checkbox" id="noticeModalEnabledCheck">
                                        <span class="mail-check-slider"></span>
                                    </label>
                                    <span class="switch-status" id="noticeModalEnabledStatus">OFF</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
</main>


<script th:inline="javascript">
        var user_no = [[${#authentication.principal.userNo}]];
        var dept_code = [[${#authentication.principal.deptCode}]];
        var proj_url = '/api/code/proj/'+user_no;

        function move(flag) {
            var url;
            if(flag == 1){
             url = '/receipt';
            }else if(flag == 2){
             url = '/appr_list';
            }
            window.location.href = url;
        }


        function openRequestDetail(seq) {
            window.open(`/api/request-detail?seq=${seq}`, 'requestDetail',
                'width=1200,height=600,scrollbars=yes,resizable=yes');
        }

        const grid = new Grid({
                  el: document.getElementById('grid'),
                  bodyHeight: 'fitToParent',
                  rowHeight: 44,
                  minRowHeight: 44,
                  focus: false,
                  rowClassName: function(args) {
                      var s = String(args.row.appr_stat == null ? '' : args.row.appr_stat);
                      if (s === '3') return 'row-status-ok';
                      if (s === '4') return 'row-status-reject';
                      if (s === '1' || s === '2') return 'row-status-progress';
                      return '';
                  },
                  rowHeaders: [
                    { type: 'rowNum', width: 48, align: 'center', valign: 'middle' },
                      ],
                  header:{
                      height: 40,
                      complexColumns: [
                      {
                        header: '고용허가기간',
                        name: 'mergeColumn1',
                        childNames: ['goyong_date1', 'goyong_date2']
                      }
                    ]
                  },
                  hideLoadingBar: true,
                  pageOptions: {
                    useClient: true,
                    type: 'scroll',
                    perPage: -1
                  },
                  columns: [
                    { header: '계약번호',name: 'seq',width: 70, align: 'center',sortable: true ,hidden: true},
                    { header: '결재번호',name: 'appr_seq',width: 70, align: 'center',sortable: true ,hidden: true},
                    { header: '확인요청일',name: 'appr_date',width: 104, align: 'center', valign: 'middle', sortable: true, escapeHTML: false
                      ,formatter: function(value) {
                        var v = value.value ? String(value.value).split(' ')[0] : '';
                        return '<span class="grid-num">' + v + '</span>';
                      }
                    },
                    { header: '확인상태',name: 'appr_stat',width: 96, align: 'center', valign: 'middle', sortable: true, escapeHTML: false
                        ,formatter: function (e) {
                            var v = e.value;
                            var label = decode(v,'0','','1','승인요청','2','진행중','3','승인완료','4','반려','');
                            var cls = 'list-status--idle';
                            if (v === '1' || v === 1) cls = 'list-status--wait';
                            else if (v === '2' || v === 2) cls = 'list-status--progress';
                            else if (v === '3' || v === 3) cls = 'list-status--ok';
                            else if (v === '4' || v === 4) cls = 'list-status--reject';
                            if (!label) return '';
                            return '<span class="list-status ' + cls + '">' + label + '</span>';
                        }
                    },
                    { header: '확인정보',name: 'confirm',width: 56, align: 'center', valign: 'middle', sortable: false, escapeHTML: false
                        ,formatter:function(e){
                            if(e.row.APPROVAL == 0){
                                return '';
                            }else{
                                return '<button type="button" class="grid-act grid-act--appr" title="확인" aria-label="확인"><i class="bi bi-clipboard-check" aria-hidden="true"></i></button>';
                            }
                        }
                    },
                    { header: '현장코드',name: 'proj_code',sortable: true, filter: 'text' , hidden: true },
                    { header: '현장명',name: 'proj_name',width: 220, sortable: true, filter:{type:'text'}, align: 'left', valign: 'middle'},
                    { header: '주거형태',name: 'res_type',width: 76, align: 'center', valign: 'middle', sortable: true,hidden:false},
                    { header: '거래방식',name: 'trans_type',width: 76, align: 'center', valign: 'middle', sortable: true,hidden:false},
                    { header: '면적',name: 'area',width: 72, align: 'center', valign: 'middle', sortable: true,hidden:false},
                    { header: '사용인원',name: 'accu',width: 72, align: 'center', valign: 'middle', sortable: true,hidden:false},
                    { header: '현장숙소 주소',name: 'address',width: 360, sortable: true, filter:{type:'text'}, align: 'left', valign: 'middle', escapeHTML: false
                       ,formatter:function(e){
                           var t = e.value == null ? '' : String(e.value);
                           return '<button type="button" class="grid-addr" title="지도 보기">' + t + '</button>';
                       }
                    },
                    { header: '계약(예정)일',name: 'cont_date',sortable: true ,width: 104, align: 'center', valign: 'middle', hidden: false, escapeHTML: false,
                         formatter: function (e) {
                            return '<span class="grid-num">' + toStringByFormatting(e.value) + '</span>';
                        }
                    },
                    { header: '입주(예정)일',name: 'move_date',sortable: true ,width: 104, align: 'center', valign: 'middle', hidden: false, escapeHTML: false,
                        formatter: function (e) {
                            return '<span class="grid-num">' + toStringByFormatting(e.value) + '</span>';
                        }
                    },

                    { header: '보증금(만원)',name: 'deposit_amt',width: 110, align: 'right', valign: 'middle', sortable: true, escapeHTML: false,
                        formatter: function (e) {
                            return '<span class="grid-num">' + ufn_comma(e.value) + '</span>';
                        }
                    },

                    { header: '월세(만원)',name: 'rent_amt',width: 110, align: 'right', valign: 'middle', sortable: true, escapeHTML: false,
                        formatter: function (e) {
                            return '<span class="grid-num">' + ufn_comma(e.value) + '</span>';
                        }
                    },
                  ],
                  columnOptions: {
                    resizable: true
                  }
                });

        ufn_select2_getData(proj_url,"#con","현장",dept_code,function(){});

        var adminSearchAllData = [];
        var adminStatFilter = 'all';

        function adminApprStatOf(row) {
            return String(row && row.appr_stat != null ? row.appr_stat : '');
        }

        function filterAdminSearchData(filter) {
            if (!Array.isArray(adminSearchAllData)) return [];
            if (filter === 'progress') {
                return adminSearchAllData.filter(function(r) {
                    var s = adminApprStatOf(r);
                    return s === '1' || s === '2';
                });
            }
            if (filter === 'approved') {
                return adminSearchAllData.filter(function(r) { return adminApprStatOf(r) === '3'; });
            }
            if (filter === 'rejected') {
                return adminSearchAllData.filter(function(r) { return adminApprStatOf(r) === '4'; });
            }
            return adminSearchAllData.slice();
        }

        function updateAdminStatCounts() {
            var all = Array.isArray(adminSearchAllData) ? adminSearchAllData : [];
            var progress = all.filter(function(r) {
                var s = adminApprStatOf(r);
                return s === '1' || s === '2';
            }).length;
            var approved = all.filter(function(r) { return adminApprStatOf(r) === '3'; }).length;
            var rejected = all.filter(function(r) { return adminApprStatOf(r) === '4'; }).length;
            $('#totalContracts').text(all.length);
            $('#pendingContracts').text(progress);
            $('#approvedContracts').text(approved);
            $('#rejectedContracts').text(rejected);
        }

        function applyAdminStatFilter() {
            grid.resetData(filterAdminSearchData(adminStatFilter));
            $('.admin-stat-btn').removeClass('is-active');
            $('.admin-stat-btn[data-stat-filter="' + adminStatFilter + '"]').addClass('is-active');
        }

        function showSearchTab() {
            var searchTab = document.getElementById('search-tab');
            if (searchTab && !searchTab.classList.contains('active') && window.bootstrap && bootstrap.Tab) {
                bootstrap.Tab.getOrCreateInstance(searchTab).show();
            }
        }

        function loadAdminSearchGrid() {
            showLoadingModal();
            var params = $("#search_form").serialize();
            $.ajax({
                url: '/api/cont_list_all',
                method: 'get',
                async: true,
                contentType: 'application/json; UTF-8;',
                dataType: 'JSON',
                data: params,
                beforeSend: function() {
                    grid.clear();
                },
                success: function(result) {
                    adminSearchAllData = Array.isArray(result) ? result : [];
                    updateAdminStatCounts();
                    applyAdminStatFilter();
                },
                complete: function() {
                    hideLoadingModal();
                },
                error: function() {
                    adminSearchAllData = [];
                    updateAdminStatCounts();
                    applyAdminStatFilter();
                }
            });
        }

        $("#con").on("select2:select select2:clear", function() {
            loadAdminSearchGrid();
        });

        $(document).on('click', '.admin-stat-btn', function() {
            var filter = String($(this).data('stat-filter') || 'all');
            adminStatFilter = filter;
            showSearchTab();
            applyAdminStatFilter();
        });
        grid.on('click',(ev)=>{
            if (ev.targetType === 'cell' && ev.columnName === 'address') {
                const rowIndex = ev.rowKey;
                const row = grid.getRow(rowIndex);

                openMap(row.address);
            }
            if (ev.targetType === 'cell' && ev.columnName === 'detail') {
                const rowIndex = ev.rowKey;
                const row = grid.getRow(rowIndex);

                detailView(row.seq);
            }

            if (ev.targetType === 'cell' && ev.columnName === 'confirm') {
                const rowIndex = ev.rowKey;
                const row = grid.getRow(rowIndex);
                if(row.conf_stat == '0'){
                    return false;
                }else if(row.conf_stat == '4'){
                   var vHtml = "";
                   vHtml += "<h3 class='text-center text-danger'>반려사유</h3>";
                   vHtml += "<p class='pt-2'>"+row.appr_remark+"</p>";
                   MsgBox.Alert(vHtml);
                   return false;
                }else{
                   openApproval(row.appr_no);
                }
            }

            if (ev.targetType === 'cell' && ev.columnName === 'docu_file') {
                const rowIndex = ev.rowKey;
                const row = grid.getRow(rowIndex);
                if(row.fn_tg == 'F'){
                    return false;
                }else{
                    btnDocContractDown(row.seq);
                }
            }


        });


    function openMap(searchTxt){
        var options = "toolbar=no,scrollbars=no,resizable=yes,status=no,menubar=no,width=1200, height=900, top=10,left=100";
        window.open("https://map.naver.com/p/search/"+searchTxt, 'docu',options);
    }

    function detailView(seq){
        var options = "toolbar=no,scrollbars=no,resizable=yes,status=no,menubar=no,width=1200, height=900, top=10,left=100";
        window.open("/api/detail-admin?seq="+seq, 'docu',options);
    }

    function openApproval(appr_no){
        var options = "toolbar=no,scrollbars=no,resizable=yes,status=no,menubar=no,width=1200, height=700, top=10,left=100";
        window.open("/appr/reg/"+appr_no,"approval", options);
    }

    $("#searchBtn").on("click",function(e){
        loadAdminSearchGrid();
    });

    function init() {
        loadAdminSearchGrid();
    }

    if (document.readyState === 'loading') {

    function showToast(message) {

        if (toastContainer.length === 0) {
            toastContainer = $('<div class="toast-container"></div>');
            $('body').append(toastContainer);
        }

        const toast = $(`
            <div class="toast">
                <div class="toast-content">
                    <i class="bi bi-check-circle-fill"></i>
                    <div class="toast-message">${message}</div>
                </div>
                <div class="toast-progress"></div>
            </div>
        `);
        
        toastContainer.append(toast);
        
        // 토스트 표시
        requestAnimationFrame(() => {
            toast.addClass('show');
        });
        
        // 토스트 제거
        setTimeout(() => {
            toast.removeClass('show');
            setTimeout(() => {

        }, 3000);
    }

    // ERP 등록 함수
    function registerToErp(mstSeq) {
        console.log('=== ERP 등록 함수 호출됨 ===');
        console.log('mstSeq:', mstSeq);
        console.log('mstSeq 타입:', typeof mstSeq);
        
        // mstSeq를 문자열로 변환하고 안전하게 체크

            showToast('마스터 시퀀스가 없습니다.');
            return;
        }
        
        console.log('✅ 유효성 검사 통과, AJAX 요청 시작');
        
        // 서버로 ERP 등록 요청
        const requestData = {
            mst_seq: mstSeqStr
        };
        
        console.log('=== AJAX 요청 데이터 ===');
        console.log('URL:', '/admin/erp/register');
        console.log('Method:', 'POST');
        console.log('Request Data:', requestData);
        
        $.ajax({
            url: '/admin/erp/register',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(requestData),
            beforeSend: function() {
                console.log('🔄 AJAX 요청 전송 중...');
            },
            success: function(response) {
                console.log('✅ ERP 등록 성공:', response);
                
                // 상세한 성공 메시지 표시

    function parseErpDeleteSeqList(input) {
        if (!input || input.trim() === '') {
            return [];
        }
        const seqSet = new Set();
        input.replace(/\r/g, '').split(/[\n,;|\t]+/).forEach(function(part) {
            const trimmed = part.trim();
            if (!/^\d+$/.test(trimmed)) {
                return;
            }
            const seqNum = parseInt(trimmed, 10);
            if (!isNaN(seqNum) && seqNum > 0) {
                seqSet.add(seqNum);
            }
        });
        return Array.from(seqSet).sort(function(a, b) { return a - b; });
    }

    function normalizeErpDeleteSeqInput(raw) {
        return parseErpDeleteSeqList(raw).join('\n');
    }

    function updateErpDeleteSeqCount() {
        const seqList = parseErpDeleteSeqList($('#erpDeleteSeqInput').val());
        const count = seqList.length;
        $('#erpDeleteSeqCount').text(count + '건');
        $('#erpDeleteBtnLabel').text(count > 0 ? count + '건 삭제' : '삭제');
    }

    function applyErpDeleteSeqPaste(rawText) {
        const normalized = normalizeErpDeleteSeqInput(rawText);
        $('#erpDeleteSeqInput').val(normalized);
        updateErpDeleteSeqCount();
        const count = parseErpDeleteSeqList(normalized).length;
        if (count > 0) {
            showToast(count + '건 SEQ 붙여넣기 완료', 'success');
        } else {
            showToast('인식된 SEQ가 없습니다. 숫자만 포함된 열을 복사해주세요.', 'error');
        }
    }

            return;
        }

        const preview = seqList.length <= 10
            ? seqList.join(', ')
            : seqList.slice(0, 10).join(', ') + ' 외 ' + (seqList.length - 10) + '건';

        if (!confirm('⚠️ 경고: 아래 SEQ(' + seqList.length + '건)의 ERP 등록 데이터가 삭제됩니다.\n\n' + preview + '\n\n삭제할 테이블:\n- TIA_B_LEASE_INTR\n- TIA_B_LEASE_TRAN\n- TIA_B_LEASE_CONT\n- TIA_B_LEASE\n\n정말 삭제하시겠습니까?')) {
            return;
        }

        console.log('=== ERP 등록 데이터 다중 삭제 요청 ===');
        console.log('SEQ 목록:', seqList);

        $.ajax({
            url: '/admin/erp/delete/multiple',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ seq_list: seqList }),
            beforeSend: function() {
                $('#erpDeleteBtn').prop('disabled', true);
                $('#erpDeleteBtnLabel').html('<span class="spinner-border spinner-border-sm me-1"></span>삭제 중...');
            },
            success: function(response) {
                console.log('✅ ERP 등록 데이터 삭제 완료:', response);

                let message = response.message || 'ERP 등록 데이터 삭제가 완료되었습니다.';
                if (response.success_count !== undefined) {
                    message += ' (성공: ' + response.success_count + '건';
                    if (response.fail_count !== undefined && response.fail_count > 0) {
                        message += ', 실패: ' + response.fail_count + '건';
                    }
                    message += ')';
                }

                const toastType = (response.fail_count && response.fail_count > 0) ? 'error' : 'success';
                showToast(message, toastType);

                if (response.failures && response.failures.length > 0) {
                    console.error('삭제 실패 SEQ:', response.failures);
                }

                if (!response.fail_count || response.success_count > 0) {
                    $('#erpDeleteSeqInput').val('');
                    updateErpDeleteSeqCount();
                }
            },
            error: function(xhr, status, error) {
                console.error('❌ ERP 등록 데이터 삭제 실패:', error);
                const errorMessage = xhr.responseJSON?.error || 'ERP 등록 데이터 삭제에 실패했습니다.';
                showToast('오류: ' + errorMessage, 'error');
            },
            complete: function() {
                $('#erpDeleteBtn').prop('disabled', false);
                updateErpDeleteSeqCount();
            }
        });
    });

    // Ctrl+Enter 로 삭제 실행 (textarea 에서 Enter 는 줄바꿈)
    $('#erpDeleteSeqInput').on('keydown', function(e) {
        if (e.which === 13 && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            $('#erpDeleteBtn').click();
        }
    });
    
    // 일괄등록 버튼 클릭
    $('#erpAllRegisterBtn').on('click', function() {
        if (!erpGrid) return;
        
        const allRows = erpGrid.getData();
        
        if (allRows.length === 0) {
            showToast('등록할 항목이 없습니다.');
            return;
        }
        
        if (!confirm('전체 ' + allRows.length + '개 항목을 ERP에 등록하시겠습니까?')) {
            return;
        }
        
        registerMultipleToErp(allRows);
    });

    // 거래처등록 탭 그리드 초기화
    let customerGrid = null;

    function createCustomerGrid(gridContainer) {
        customerGrid = new Grid({
            el: gridContainer,
            bodyHeight: 'fitToParent',
            rowHeight: 44,
            minRowHeight: 44,
            focus: false,
            rowHeaders: [
                { type: 'rowNum', width: 48, align: 'center', valign: 'middle' },
                { type: 'checkbox', width: 40, align: 'center', valign: 'middle' }
            ],
            header: { height: 40 },
            hideLoadingBar: true,
            pageOptions: {
                useClient: true,
                type: 'scroll',
                perPage: -1
            },
            columns: [
                { header: '결재번호', name: 'appr_no_list', width: 50, align: 'center', sortable: true, hidden: true },
                { header: '기안자', name: 'user_nm', width: 96, align: 'center', valign: 'middle', sortable: true },
                { header: '현장명', name: 'proj_name', width: 260, sortable: true, filter: { type: 'text' }, align: 'left', valign: 'middle' },
                { header: '주소', name: 'address', minWidth: 280, sortable: true, filter: { type: 'text' }, align: 'left', valign: 'middle' },
                { header: '계약건수', name: 'contract_count', width: 80, align: 'center', valign: 'middle', sortable: true,
                    formatter: function(e) {
                        return e.value ? e.value + '건' : '0건';
                    }
                },
                { header: '기안서번호', name: 'mst_seq', width: 100, align: 'center', valign: 'middle', sortable: true },
                { header: '결재상태', name: 'conf_status_name', width: 96, align: 'center', valign: 'middle', sortable: true, escapeHTML: false,
                    formatter: function (e) {
                        var status = e.value || '';
                        var cls = 'list-status--idle';
                        if (status === '반려') cls = 'list-status--reject';
                        else if (status === '결재중') cls = 'list-status--progress';
                        else if (status === '보류') cls = 'list-status--wait';
                        else if (status === '완료') cls = 'list-status--ok';
                        return '<span class="list-status ' + cls + '">' + status + '</span>';
                    }
                },
                {
                    header: '거래처등록',
                    name: 'customer_register',
                    width: 64,
                    align: 'center',
                    valign: 'middle',
                    sortable: false,
                    escapeHTML: false,
                    formatter: function(e) {
                        const buttonId = 'customer-btn-' + e.row.mst_seq;
                        return '<button type="button" id="' + buttonId + '" class="grid-act grid-act--appr" data-mst="' + e.row.mst_seq + '" title="등록" aria-label="등록"><i class="bi bi-building" aria-hidden="true"></i></button>';
                    }
                }
            ],
            columnOptions: { resizable: true }
        });

        customerGrid.on('check', updateCustomerSelectedCount);
        customerGrid.on('uncheck', updateCustomerSelectedCount);
        customerGrid.on('checkAll', updateCustomerSelectedCount);
        customerGrid.on('uncheckAll', updateCustomerSelectedCount);

        $(document).off('click', '[id^="customer-btn-"]').on('click', '[id^="customer-btn-"]', function() {
            const mstSeq = $(this).data('mst');
            registerCustomer(mstSeq);
        });
    }

    // 거래처등록 데이터 로드
    function loadCustomerData() {
        $.ajax({
            url: '/appr/list/draft/completed/admin',
            method: 'GET',
            success: function(response) {
                console.log('거래처등록 데이터 로드 성공:', response);

                const gridContainer = document.getElementById('customerGrid');
                if (!gridContainer) {
                    return;
                }

                if (!customerGrid) {
                    createCustomerGrid(gridContainer);
                }

                customerGrid.resetData(response || []);
                setTimeout(function() {
                    if (customerGrid) customerGrid.refreshLayout();
                }, 50);
            },
            error: function(xhr, status, error) {
                console.error('거래처등록 데이터 로드 오류:', error);
            }
        });
    }

    // 거래처 등록 함수
    function registerCustomer(mstSeq) {
        console.log('=== 거래처 등록 함수 호출됨 ===');
        console.log('mstSeq:', mstSeq);
        
        const mstSeqStr = String(mstSeq || '');
        if (!mstSeqStr || mstSeqStr.trim() === '') {
            console.log('❌ 마스터 시퀀스가 없습니다.');
            showToast('마스터 시퀀스가 없습니다.');
            return;
        }
        
        console.log('✅ 유효성 검사 통과, AJAX 요청 시작');
        
        const requestData = {
            mst_seq: mstSeqStr
        };
        
        console.log('=== AJAX 요청 데이터 ===');
        console.log('URL:', '/admin/customer/register');
        console.log('Method:', 'POST');
        console.log('Request Data:', requestData);
        
        $.ajax({
            url: '/admin/customer/register',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(requestData),
            beforeSend: function() {
                console.log('🔄 AJAX 요청 전송 중...');
            },
            success: function(response) {
                console.log('✅ 거래처 등록 성공:', response);
                
                let message = response.message || '거래처 등록이 완료되었습니다.';
                if (response.update_count !== undefined) {
                    message += '\n등록: ' + response.update_count + '건';
                }
                
                showToast(message);
                
                // 등록 완료 후 그리드 새로고침
                loadCustomerData();
            },
            error: function(xhr, status, error) {
                console.error('❌ 거래처 등록 실패:');
                console.error('Status:', status);
                console.error('Error:', error);
                console.error('Response Text:', xhr.responseText);
                console.error('Response JSON:', xhr.responseJSON);
                
                const errorMessage = xhr.responseJSON?.error || '거래처 등록에 실패했습니다.';
                showToast('오류: ' + errorMessage);
            }
        });
    }

    // 선택된 항목 수 업데이트
    function updateCustomerSelectedCount() {
        if (!customerGrid) return;
        
        const checkedRows = customerGrid.getCheckedRows();
        const count = checkedRows.length;
        
        $('#customerSelectedCount').text(count);
        $('#customerSelectRegisterBtn').prop('disabled', count === 0);
    }

    // 선택등록 버튼 클릭
    $('#customerSelectRegisterBtn').on('click', function() {
        if (!customerGrid) return;
        
        const checkedRows = customerGrid.getCheckedRows();
        
        if (checkedRows.length === 0) {
            showToast('등록할 항목을 선택해주세요.');
            return;
        }
        
        if (!confirm(checkedRows.length + '개 항목의 거래처를 등록하시겠습니까?')) {
            return;
        }
        
        registerMultipleCustomers(checkedRows);
    });

    // 일괄등록 버튼 클릭
    $('#customerAllRegisterBtn').on('click', function() {
        if (!customerGrid) return;
        
        const allRows = customerGrid.getData();
        
        if (allRows.length === 0) {
            showToast('등록할 항목이 없습니다.');
            return;
        }
        
        if (!confirm('전체 ' + allRows.length + '개 항목의 거래처를 등록하시겠습니까?')) {
            return;
        }
        
        registerMultipleCustomers(allRows);
    });

    // 다중 거래처 등록 함수
    function registerMultipleCustomers(rows) {
        console.log('=== 다중 거래처 등록 시작 ===');
        console.log('등록할 항목 수:', rows.length);
        
        const mstSeqList = rows.map(row => row.mst_seq).filter(seq => seq);
        
        if (mstSeqList.length === 0) {
            showToast('유효한 mst_seq가 없습니다.');
            return;
        }
        
        console.log('mst_seq 목록:', mstSeqList);
        
        let successCount = 0;
        let failCount = 0;
        let completed = 0;
        
        // 각 항목에 대해 순차적으로 등록
        mstSeqList.forEach(function(mstSeq, index) {
            setTimeout(function() {
                const requestData = { mst_seq: mstSeq };
                
                $.ajax({
                    url: '/admin/customer/register',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(requestData),
                    success: function(response) {
                        successCount++;
                        completed++;
                        console.log('✅ 거래처 등록 성공 (' + completed + '/' + mstSeqList.length + '):', mstSeq);
                        
                        if (completed === mstSeqList.length) {
                            let message = '거래처 등록이 완료되었습니다.';
                            message += '\n성공: ' + successCount + '건';
                            if (failCount > 0) {
                                message += '\n실패: ' + failCount + '건';
                            }
                            showToast(message);
                            loadCustomerData();
                        }
                    },
                    error: function(xhr, status, error) {
                        failCount++;
                        completed++;
                        console.error('❌ 거래처 등록 실패 (' + completed + '/' + mstSeqList.length + '):', mstSeq);
                        
                        if (completed === mstSeqList.length) {
                            let message = '거래처 등록이 완료되었습니다.';
                            message += '\n성공: ' + successCount + '건';
                            if (failCount > 0) {
                                message += '\n실패: ' + failCount + '건';
                            }
                            showToast(message);
                            loadCustomerData();
                        }
                    }
                });
            }, index * 100); // 100ms 간격으로 요청
        });
    }

    // 다중 ERP 등록 함수
    function registerMultipleToErp(rows) {
        console.log('=== 다중 ERP 등록 시작 ===');
        console.log('등록할 항목 수:', rows.length);
        
        // mst_seq 배열 추출
        const mstSeqList = rows.map(row => row.mst_seq).filter(seq => seq);
        
        if (mstSeqList.length === 0) {
            showToast('유효한 mst_seq가 없습니다.');
            return;
        }
        
        console.log('mst_seq 목록:', mstSeqList);
        
        // 서버로 다중 등록 요청
        $.ajax({
            url: '/admin/erp/register/multiple',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ mst_seq_list: mstSeqList }),
            beforeSend: function() {
                showToast('ERP 등록 중...');
            },
            success: function(response) {
                console.log('✅ 다중 ERP 등록 성공:', response);
                
                let message = 'ERP 등록이 완료되었습니다.';
                if (response.success_count !== undefined) {
                    message += '\n성공: ' + response.success_count + '건';
                }
                if (response.fail_count !== undefined && response.fail_count > 0) {
                    message += '\n실패: ' + response.fail_count + '건';
                }
                if (response.total_count !== undefined) {
                    message += '\n전체: ' + response.total_count + '건';
                }
                
                showToast(message);
                
                // 등록 완료 후 그리드 새로고침
                loadErpData();
                updateErpSelectedCount();
            },
            error: function(xhr, status, error) {
                console.error('❌ 다중 ERP 등록 실패:', error);
                const errorMessage = xhr.responseJSON?.error || 'ERP 등록에 실패했습니다.';
                showToast('오류: ' + errorMessage);
            }
        });
    }

    // 전역 스코프에 함수 할당
    window.registerToErp = registerToErp;

    </script>
</body>
</html>
