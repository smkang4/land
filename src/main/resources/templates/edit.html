<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: headFragment('계약서 수정', null)}"></th:block>
    <link rel="stylesheet" th:href="@{/css/detail.css}">
    <link rel="stylesheet" th:href="@{/css/doc-desk.css}">
    <link rel="stylesheet" th:href="@{/css/edit.css}">
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

</head>
<body class="app-shell--quiet">
<main class="edit-desk">
    <div class="detail-container" th:each="detail : ${detail}">
        <form id="editForm" class="detail-card" th:action="@{/api/update}" method="post">
                <input type="hidden" name="seq" th:value="${detail.seq}">
                <input type="hidden" name="rewrite" th:value="${rewrite}" id="rewrite">
                <input type="hidden" name="emp_no" th:value="${detail.emp_no}">
                <input type="hidden" name="user_nm" th:value="${detail.user_nm}">
                <input type="hidden" name="proj_code" th:value="${detail.proj_code}">
                <input type="hidden" name="d_seq" th:value="${detail.d_seq}">
            <div class="detail-header">
                <h2 class="detail-title">
                    <input type="text" name="proj_name" th:value="${detail.proj_name}"
                           class="form-input">
                </h2>
                <div class="detail-info">
                    <span><i class="bi bi-person"></i> <span th:text="${detail.user_nm}">작성자</span></span>
                    <span><i class="bi bi-calendar"></i> <span th:text="${detail.crtdate}">작성일</span></span>
                </div>
            </div>

            <div class="detail-content">
                <!-- 상단 좌우 레이아웃 -->
                <div class="row g-3 mb-3">
                    <!-- 왼쪽: 기본정보 -->
                    <div class="col-md-6">
                        <div class="detail-section edit-basics h-100">
                            <h3 class="detail-section-title"><i class="bi bi-info-circle"></i> 기본 정보</h3>

                            <div class="edit-field-group">
                                <div class="edit-field-group__label">위치</div>
                                <div class="edit-fields">
                                    <div class="edit-field edit-field--full">
                                        <label class="edit-field__label" for="editAddress">주소</label>
                                        <div class="edit-address">
                                            <input type="text" name="address" th:value="${detail.address}" class="form-input" id="editAddress" readonly placeholder="주소를 검색하세요" onclick="sample6_execDaumPostcode()">
                                            <button type="button" class="btn edit-address__btn" onclick="sample6_execDaumPostcode()">
                                                <i class="bi bi-search"></i> 검색
                                            </button>
                                            <input type="hidden" name="postCode" th:value="${detail.post_code}" id="editPostCode">
                                        </div>
                                    </div>
                                    <div class="edit-field edit-field--full">
                                        <label class="edit-field__label" for="editAddress2">상세주소</label>
                                        <input type="text" name="address_d" th:value="${detail.address_d}" class="form-input" id="editAddress2" placeholder="동·호수 등">
                                    </div>
                                </div>
                            </div>

                            <div class="edit-field-group">
                                <div class="edit-field-group__label">일정 · 금액</div>
                                <div class="edit-fields edit-fields--2">
                                    <div class="edit-field">
                                        <label class="edit-field__label">계약일</label>
                                        <input type="date" name="cont_date" th:value="${detail.cont_date}" class="form-input">
                                    </div>
                                    <div class="edit-field">
                                        <label class="edit-field__label">이사일</label>
                                        <input type="date" name="move_date" th:value="${detail.move_date}" class="form-input">
                                    </div>
                                    <div class="edit-field" th:if="${detail.cont_period != null and detail.cont_period != ''}">
                                        <label class="edit-field__label">계약기간</label>
                                        <div class="edit-unit">
                                            <input type="number" name="cont_period" th:value="${detail.cont_period}" class="form-input personnel-input" min="1">
                                            <span class="edit-unit__suffix">개월</span>
                                        </div>
                                    </div>
                                    <div class="edit-field">
                                        <label class="edit-field__label" for="depositAmt">보증금</label>
                                        <div class="edit-unit">
                                            <input type="number" class="form-input amount-input" id="depositAmt" name="deposit_amt" th:value="${detail.deposit_amt}" required>
                                            <span class="edit-unit__suffix">만원</span>
                                        </div>
                                    </div>
                                    <div class="edit-field">
                                        <label class="edit-field__label" for="rentAmt">월세</label>
                                        <div class="edit-unit">
                                            <input type="number" class="form-input amount-input" id="rentAmt" name="rent_amt" th:value="${detail.rent_amt}" required>
                                            <span class="edit-unit__suffix">만원</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="edit-field-group">
                                <div class="edit-field-group__label">물건</div>
                                <div class="edit-fields edit-fields--2">
                                    <div class="edit-field">
                                        <label class="edit-field__label">주거유형</label>
                                        <select name="res_type" class="form-select">
                                            <option value="">선택하세요</option>
                                            <option value="아파트" th:selected="${detail.res_type == '아파트'}">아파트</option>
                                            <option value="빌라" th:selected="${detail.res_type == '빌라'}">빌라</option>
                                            <option value="원룸" th:selected="${detail.res_type == '원룸'}">원룸</option>
                                            <option value="오피스텔" th:selected="${detail.res_type == '오피스텔'}">오피스텔</option>
                                        </select>
                                    </div>
                                    <div class="edit-field">
                                        <label class="edit-field__label">거래유형</label>
                                        <select name="trans_type" class="form-select">
                                            <option value="">선택하세요</option>
                                            <option value="전세" th:selected="${detail.trans_type == '전세'}">전세</option>
                                            <option value="월세" th:selected="${detail.trans_type == '월세'}">월세</option>
                                            <option value="매매" th:selected="${detail.trans_type == '매매'}">매매</option>
                                        </select>
                                    </div>
                                    <div class="edit-field">
                                        <label class="edit-field__label" for="zip">전용면적</label>
                                        <div class="edit-unit">
                                            <input type="number" class="form-input area-input" id="zip" placeholder="면적" name="area"
                                                   th:value="${detail != null and detail.area != 0 ? detail.area : ''}">
                                            <span class="edit-unit__suffix">m²</span>
                                        </div>
                                        <small class="edit-field__hint pyeong-value"></small>
                                    </div>
                                    <div class="edit-field">
                                        <label class="edit-field__label" for="accu">사용인원</label>
                                        <div class="edit-unit edit-unit--split">
                                            <select class="form-select" id="accu_type" name="accu_type" th:if="${detail.accu_type != null and detail.accu_type != ''}">
                                                <option value="">직급</option>
                                                <option value="임원" th:selected="${detail.accu_type == '임원'}">임원</option>
                                                <option value="관리직" th:selected="${detail.accu_type == '관리직'}">관리직</option>
                                                <option value="기능직" th:selected="${detail.accu_type == '기능직'}">기능직</option>
                                                <option value="비정규직" th:selected="${detail.accu_type == '비정규직'}">비정규직</option>

                                            <input type="number" class="form-input personnel-input" id="accu" placeholder="인원" name="accu"
                                                   th:value="${detail != null and detail.accu != 0 ? detail.accu : ''}">

                                    </div>
                                </div>
                            </div>

                            <div class="detail-item p-3 checklist-item">
                                <div class="detail-label checklist-label">전세권을 설정하는가</div>
                                <div class="detail-value">

                                </div>

                                    <textarea name="chk_reason_3" class="check-reason-textarea"

                            <div class="detail-item p-3 checklist-item">
                                <div class="detail-label checklist-label">부동산 공인중개사무소를 통하여 거래하는가</div>

                                            </div>

                                                <input type="radio" name="chk_4" value="N" th:checked="${detail.chk_4 == 'N'}" id="chk4_n">
                                                <label for="chk4_n">아니오</label>

                                        </div>

                            </div>
                            <!-- 부동산정보 파일 섹션 -->
                            <div id="file-section-4" class="edit-file-section">
                                <div class="file-attach">
                                    <div class="file-attach__head">

                                            <h6 class="file-attach__title">부동산명함 및 정보</h6>

                                                <i class="bi bi-cloud-arrow-up"></i>
                                            </span>
                                            <span class="file-attach__zone-title">클릭하거나 파일을 놓으면 바로 업로드됩니다</span>

</main>

    <script>
        // Daum Postcode API 함수
        function sample6_execDaumPostcode() {
            new daum.Postcode({
                oncomplete: function(data) {
                    var addr = ''; // 주소 변수
                    var extraAddr = ''; // 참고항목 변수

                    if (data.userSelectedType === 'R') {
                        addr = data.roadAddress;
                    } else { // 사용자가 지번 주소를 선택했을 경우(J)
                        addr = data.jibunAddress;
                    }

                    if(data.userSelectedType === 'R'){
                        // 법정동명이 있을 경우 추가한다. (법정리는 제외)
                        // 법정동의 경우 마지막 문자가 "동/로/가"로 끝난다.
                        if(data.bname !== '' && /[동|로|가]$/g.test(data.bname)){
                            extraAddr += data.bname;
                        }

                    document.getElementById("editPostCode").value = data.zonecode;

        $(document).ready(function() {

            // 파일 업로드 관련 변수
            let uploadedFiles = [];
            const MAX_FILE_SIZE = 10 * 1024 * 1024; // 10MB
            const MAX_FILES = 5;

            // 기존 파일 로드 함수
            function loadExistingFiles() {
                console.log('기존 파일 로드 시작');

                                id: fileName.trim(),
                                originalName: fileName.trim(),

                    });
                }
                
                console.log('최종 uploadedFiles:', uploadedFiles);
            }

            // 기존 파일들을 uploadedFiles 배열에 추가하는 함수
            function addExistingFilesToArray() {
                console.log('기존 파일들을 uploadedFiles 배열에 추가 시작');
                
                // 부동산정보 파일들 (화면에 표시된 기존 파일들)

                        if (!exists) {

                                id: fileId,
                                originalName: fileName,
                                section: 'real_estate'
                            };
                            console.log('부동산정보 기존 파일 추가:', fileInfo);
                            uploadedFiles.push(fileInfo);
                        }
                    }
                });
                
                // 등기부등본 파일들 (화면에 표시된 기존 파일들)
                $('.file-list-5 .list-group-item').each(function() {
                    const fileId = $(this).find('.delete-btn').data('file-id');
                    const fileName = $(this).find('.file-name').text();
                    
                    if (fileId && fileName) {
                        // 이미 배열에 있는지 확인
                        const exists = uploadedFiles.some(file => file.id === fileId);
                        if (!exists) {
                            const fileInfo = {
                                id: fileId,
                                originalName: fileName,
                                section: 'credit'
                            };
                            console.log('채권순위 기존 파일 추가:', fileInfo);
                            uploadedFiles.push(fileInfo);
                        }
                    }
                });
                
                console.log('최종 uploadedFiles (기존 파일 포함):', uploadedFiles);
            }

            // 페이지 로드 시 기존 파일 로드
            loadExistingFiles();

            // 페이지 로드 시 체크리스트 상태 초기화
            $('input[type="radio"]:checked').each(function() {
                const reasonId = this.name.replace('chk_', 'reason');
                const reasonContainer = document.getElementById(reasonId);
                const fileSectionId = this.name.replace('chk_', 'file-section-');
                const fileSection = document.getElementById(fileSectionId);
                
                if (this.value === 'N') {
                    reasonContainer.style.display = 'block';
                    if (fileSectionId === 'file-section-4' || fileSectionId === 'file-section-5') {
                        fileSection.style.display = 'none';
                    }
                } else {
                    reasonContainer.style.display = 'none';
                    if (fileSectionId === 'file-section-4' || fileSectionId === 'file-section-5') {
                        fileSection.style.display = 'block';
                    }
                }
            });

            // 체크리스트 라디오 버튼 이벤트 처리
            $(document).on('change', 'input[type="radio"]', function() {
                const reasonId = this.name.replace('chk_', 'reason');
                const reasonContainer = document.getElementById(reasonId);
                const fileSectionId = this.name.replace('chk_', 'file-section-');
                const fileSection = document.getElementById(fileSectionId);
                
                if (this.value === 'N') {
                    reasonContainer.style.display = 'block';
                    if (fileSectionId === 'file-section-4' || fileSectionId === 'file-section-5') {
                        fileSection.style.display = 'none';
                    }
                } else {
                    reasonContainer.style.display = 'none';
                    if (fileSectionId === 'file-section-4' || fileSectionId === 'file-section-5') {
                        fileSection.style.display = 'block';
                    }
                }
            });

            // 파일 크기 포맷팅
            function formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }

            // 파일 목록에 파일 추가
            function addFileToList(file, fileList) {
                const sizeLabel = file.size ? `<span class="file-attach__item-size">${formatFileSize(file.size)}</span>` : '';
                const fileItem = `
                    <div class="list-group-item file-attach__item" data-file-id="${file.id}" data-section="${file.section}">
                        <div class="file-attach__item-main">
                            <span class="file-attach__item-icon" aria-hidden="true"><i class="bi bi-file-earmark-text"></i></span>
                            <div class="file-attach__item-meta">
                                <span class="file-name file-attach__item-name">${file.originalName}</span>
                                ${sizeLabel}
                            </div>
                        </div>
                        <div class="file-actions file-attach__item-actions">
                            <a href="/api/download-file/${file.id}"
                               class="btn btn-sm btn-outline-secondary"
                               download="${file.originalName}"
                               target="_blank"
                               title="다운로드">
                                <i class="bi bi-download"></i>
                            </a>
                            <button type="button" class="btn btn-sm btn-outline-danger delete-btn"
                                    data-file-id="${file.id}"
                                    data-section="${file.section}"
                                    title="삭제">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
                fileList.find('.text-muted').remove();
                fileList.append(fileItem);
            }

            function setUploadZoneBusy(sectionId, busy) {
                const zone = document.querySelector(`[data-zone-for="${sectionId}"]`);
                if (!zone) return;
                zone.classList.toggle('is-uploading', !!busy);
                const status = zone.querySelector('.file-attach__zone-status');
                const title = zone.querySelector('.file-attach__zone-title');
                const meta = zone.querySelector('.file-attach__zone-meta');
                const icon = zone.querySelector('.file-attach__zone-icon i');
                if (status) status.hidden = !busy;
                if (title) title.hidden = !!busy;
                if (meta) meta.hidden = !!busy;
                if (icon) icon.className = busy ? 'bi bi-arrow-repeat file-attach__spin' : 'bi bi-cloud-arrow-up';
            }

            function uploadFilesForSection(sectionId, fileListOverride) {
                const fileInput = $(`.file-upload-${sectionId}`)[0];
                const files = fileListOverride || (fileInput && fileInput.files);
                if (!files || files.length === 0) {
                    return;
                }
                const fileList = $(`.file-list-${sectionId}`);
                const section = sectionId === '4' ? 'real_estate' : 'credit';

                if (uploadedFiles.length + files.length > MAX_FILES) {
                    alert(`최대 ${MAX_FILES}개까지만 파일을 업로드할 수 있습니다.`);
                    if (fileInput) fileInput.value = '';
                    return;
                }

                for (let file of files) {
                    if (file.size > MAX_FILE_SIZE) {
                        alert(`파일 크기는 최대 10MB까지 가능합니다.\n문제 파일: ${file.name}`);
                        if (fileInput) fileInput.value = '';
                        return;
                    }
                }

                const formData = new FormData();
                for (let file of files) {
                    formData.append('files', file);
                }
                formData.append('section', section);

                setUploadZoneBusy(sectionId, true);
                $.ajax({
                    url: '/api/upload-files',
                    type: 'POST',
                    data: formData,
                    processData: false,
                    contentType: false,
                    success: function(response) {
                        if (response.success) {
                            response.files.forEach(file => {
                                uploadedFiles.push(file);
                                addFileToList(file, fileList);
                            });
                            if (fileInput) fileInput.value = '';
                        } else {
                            alert('파일 업로드 실패: ' + response.message);
                        }
                    },
                    error: function(xhr, status, error) {
                        console.error('Upload error:', error);
                        alert('파일 업로드 중 오류가 발생했습니다.');
                    },
                    complete: function() {
                        setUploadZoneBusy(sectionId, false);
                    }
                });
            }

            // 파일 선택 시 바로 업로드
            $(document).on('change', '.file-upload-4, .file-upload-5', function() {
                const sectionId = $(this).hasClass('file-upload-4') ? '4' : '5';
                uploadFilesForSection(sectionId);
            });

            // 드래그 앤 드롭
            $(document).on('dragover dragenter', '.file-attach__zone', function(e) {
                e.preventDefault();
                e.stopPropagation();
                $(this).addClass('is-dragover');
            });
            $(document).on('dragleave dragend drop', '.file-attach__zone', function(e) {
                e.preventDefault();
                e.stopPropagation();
                $(this).removeClass('is-dragover');
            });
            $(document).on('drop', '.file-attach__zone', function(e) {
                const sectionId = String($(this).data('zone-for'));
                const dt = e.originalEvent.dataTransfer;
                if (!dt || !dt.files || !dt.files.length) return;
                uploadFilesForSection(sectionId, dt.files);
            });

            // 숨김 업로드 버튼(호환)
            $(document).on('click', '.upload-btn-4, .upload-btn-5', function() {
                const sectionId = $(this).attr('class').split(' ').find(cls => cls.startsWith('upload-btn-')).split('-')[2];
                uploadFilesForSection(sectionId);
            });

            // 파일 삭제
            $(document).on('click', '.delete-btn', function() {
                const fileId = $(this).data('file-id');
                const fileItem = $(this).closest('.list-group-item');

                if (!fileId) {
                    alert('파일 ID가 없습니다.');
                    return;
                }

                if (confirm('파일을 삭제하시겠습니까?')) {
                    $.ajax({
                        url: '/api/delete-file/' + encodeURIComponent(fileId),
                        type: 'DELETE',
                        success: function(response) {
                            if (response.success) {
                                uploadedFiles = uploadedFiles.filter(f => f.id !== fileId);
                                fileItem.remove();
                            } else {
                                alert('파일 삭제 실패: ' + response.message);
                            }
                        },
                        error: function(xhr, status, error) {
                            console.error('Delete error:', error);
                            
                            if (xhr.status === 400) {
                                console.log('파일이 이미 삭제되어 있음. UI에서만 제거합니다.');
                                uploadedFiles = uploadedFiles.filter(f => f.id !== fileId);
                                fileItem.remove();
                            } else {
                                let errorMessage = '파일 삭제 중 오류가 발생했습니다.';
                                try {
                                    const response = JSON.parse(xhr.responseText);
                                    if (response.message) {
                                        errorMessage = response.message;
                                    }
                                } catch (e) {
                                    console.error('Error parsing response:', e);
                                }
                                alert(errorMessage);
                            }
                        }
                    });
                }
            });

            // 폼 제출 처리
            $(document).on('submit', '#editForm', function(e) {
                e.preventDefault();
                
                // 폼 제출 전에 기존 파일들을 uploadedFiles 배열에 추가
                addExistingFilesToArray();
                
                // 기본 필드 유효성 검사
                const address = $('input[name="address"]').val();
                const addressD = $('input[name="address_d"]').val();
                const contDate = $('input[name="cont_date"]').val();
                const moveDate = $('input[name="move_date"]').val();
                const depositAmt = $('input[name="deposit_amt"]').val();
                const rentAmt = $('input[name="rent_amt"]').val();
                const resType = $('select[name="res_type"]').val();
                const transType = $('select[name="trans_type"]').val();
                const area = $('input[name="area"]').val();
                const contPeriod = $('input[name="cont_period"]').val();
                const accuType = $('#accu_type').val();
                const accu = $('#accu').val();
                
                // 주소 필수 검사
                if (!address || address.trim() === '') {
                    alert('주소를 입력해주세요.');
                    $('input[name="address"]').focus();
                    return;
                }
                
                // 상세주소 필수 검사
                if (!addressD || addressD.trim() === '') {
                    alert('상세주소를 입력해주세요.');
                    $('input[name="address_d"]').focus();
                    return;
                }
                
                // 계약일 필수 검사
                if (!contDate) {
                    alert('계약일을 선택해주세요.');
                    $('input[name="cont_date"]').focus();
                    return;
                }
                
                // 이사일 필수 검사
                if (!moveDate) {
                    alert('이사일을 선택해주세요.');
                    $('input[name="move_date"]').focus();
                    return;
                }
                
                // 보증금 필수 검사
                if (!depositAmt || depositAmt.trim() === '') {
                    alert('보증금을 입력해주세요.');
                    $('input[name="deposit_amt"]').focus();
                    return;
                }
                
                // 월세 필수 검사
                if (!rentAmt || rentAmt.trim() === '') {
                    alert('월세를 입력해주세요.');
                    $('input[name="rent_amt"]').focus();
                    return;
                }
                
                // 주거유형 필수 검사
                if (!resType) {
                    alert('주거유형을 선택해주세요.');
                    $('select[name="res_type"]').focus();
                    return;
                }
                
                // 거래유형 필수 검사
                if (!transType) {
                    alert('거래유형을 선택해주세요.');
                    $('select[name="trans_type"]').focus();
                    return;
                }
                
                // 면적 필수 검사
                if (!area || area.trim() === '') {
                    alert('면적을 입력해주세요.');
                    $('input[name="area"]').focus();
                    return;
                }
                
                // 면적 숫자 검사
                if (isNaN(area) || parseFloat(area) <= 0) {
                    alert('면적은 0보다 큰 숫자여야 합니다.');
                    $('input[name="area"]').focus();
                    return;
                }
                
                // 계약기간 유효성 검사 (값이 있는 경우에만)
                if (contPeriod && (isNaN(contPeriod) || parseInt(contPeriod) < 1)) {
                    alert('계약기간은 1 이상의 숫자여야 합니다.');
                    $('input[name="cont_period"]').focus();
                    return;
                }
                
                // 사용인원 유효성 검사
                if (!accu || isNaN(accu) || parseInt(accu) < 1) {
                    alert('사용인원은 1 이상의 숫자여야 합니다.');
                    $('#accu').focus();
                    return;
                }
                
                // 인원유형이 표시된 경우 선택 필수
                if ($('#accu_type').is(':visible') && !accuType) {
                    alert('인원유형을 선택해주세요.');
                    $('#accu_type').focus();
                    return;
                }
                
                // 체크리스트 유효성 검사
                for (let i = 1; i <= 5; i++) {
                    const yesChecked = $(`input[name="chk_${i}"][value="Y"]`).is(':checked');
                    const noChecked = $(`input[name="chk_${i}"][value="N"]`).is(':checked');
                    const reason = $(`textarea[name="chk_reason_${i}"]`).val();
                    
                    // 체크리스트 항목 중 하나는 선택되어야 함
                    if (!yesChecked && !noChecked) {
                        alert(`체크리스트 ${i}번 항목을 선택해주세요.`);
                        $(`input[name="chk_${i}"][value="Y"]`).closest('.check-radio-group').focus();
                        return;
                    }
                    
                    // NO 선택 시 사유 필수
                    if (noChecked && (!reason || reason.trim() === '')) {
                        alert(`체크리스트 ${i}번 항목의 사유를 입력해주세요.`);
                        $(`textarea[name="chk_reason_${i}"]`).focus();
                        return;
                    }
                }
                
                const formData = new FormData(this);
                const data = {};
                formData.forEach((value, key) => {
                    // 금액 필드의 경우 콤마 제거
                    if (key === 'deposit_amt' || key === 'rent_amt') {
                        data[key] = value.replace(/,/g, '');
                    } else {
                        data[key] = value;
                    }
                });
                
                // rewrite 값 명시적으로 추가
                data.rewrite = $('#rewrite').val();


                // 파일 정보 추가
                data.attachments = {
                    realEstate: uploadedFiles.filter(f => f.section === 'real_estate' || f.section === '부동산정보'),
                    credit: uploadedFiles.filter(f => f.section === 'credit' || f.section === '채권순위')
                };
                
                // 디버깅을 위한 로그
                console.log('전송할 데이터:', data);
                console.log('uploadedFiles:', uploadedFiles);
                console.log('attachments:', data.attachments);

                $.ajax({
                    url: $(this).attr('action'),
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify(data),
                    success: function(response) {
                        console.log('서버 응답:', response);
                        alert('수정이 완료되었습니다.');
                        window.location.href = '/detail?seq='+data.seq;
                    },
                    error: function(xhr, status, error) {
                        console.log('에러 발생:', {xhr, status, error});
                        alert('수정 중 오류가 발생했습니다: ' + error);
                    }
                });
            });

            // 금액 입력 필드에 이벤트 리스너 추가
            $('.amount-input').on('input', function() {
                let value = $(this).val().replace(/,/g, ''); // 기존 콤마 제거
                if (value) {
                    value = parseInt(value).toLocaleString(); // 천 단위 콤마 추가
                    $(this).val(value);
                }
            });

            // 금액 입력 필드 포커스 아웃 시 콤마 추가
            $('.amount-input').on('blur', function() {
                let value = $(this).val().replace(/,/g, '');
                if (value) {
                    value = parseInt(value).toLocaleString();
                    $(this).val(value);
                }
            });

            // 금액 입력 필드 포커스 시 콤마 제거
            $('.amount-input').on('focus', function() {
                let value = $(this).val().replace(/,/g, '');
                $(this).val(value);
            });

            // 면적 입력 필드 이벤트 처리
            $('.area-input').on('input', function() {
                const value = $(this).val();
                if (value) {
                    const pyeong = (parseFloat(value) / 3.30578).toFixed(2);
                    $(this).next('.pyeong-value').text(`약 ${pyeong}평`);
                } else {
                    $(this).next('.pyeong-value').text('');
                }
            });

            // 초기 로드 시 평수 표시
            const initialArea = $('.area-input').val();
            if (initialArea) {
                const pyeong = (parseFloat(initialArea) / 3.30578).toFixed(2);
                $('.area-input').next('.pyeong-value').text(`약 ${pyeong}평`);
            }
        });
    </script>
</body>
</html>
