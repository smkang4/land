# 업로드 파일 크기 제한 완화 (1000MB) - 413 Request Entity Too Large 해결
# rent.dage.co.kr 서버의 nginx(1.29.0) 설정에 아래 내용을 반영해야 합니다.
#
# [증상] 2MB 정도만 올려도 413, 서버(Spring) 로그 없음 → Nginx에서 차단된 상태.
#       (기본값이 1m 이라 2.25MB가 이미 초과)
#
# === 서버에서 확인 절차 ===
#
# 1) 실제 적용 중인 설정 보기:
#    sudo nginx -T 2>/dev/null | grep -E "server_name|client_max_body_size"
#    → rent.dage.co.kr 가 나오는 server 블록과, 그 블록/상위에 client_max_body_size 가 있는지 확인.
#
# 2) rent.dage.co.kr 설정 파일 위치 찾기:
#    sudo nginx -T 2>/dev/null | grep -B5 "rent.dage.co.kr"
#    → "# configuration file ..." 으로 어느 파일 몇 번째 줄인지 나옴.
#
# 3) 그 파일을 열어서 rent.dage.co.kr 인 server { } 블록 안 맨 위에 한 줄 추가:
#
#    server {
#        server_name rent.dage.co.kr;
#        client_max_body_size 1000M;    # 이 줄 추가 (반드시 이 server 블록 안에)
#        ... 기존 location 등 ...
#        location / {
#            proxy_pass http://...;
#            proxy_request_buffering off;
#            ...
#        }
#    }
#
# 4) 또는 /api 전부에만 적용하려면 location 으로:
#
#    location /api/ {
#        client_max_body_size 1000M;
#        proxy_request_buffering off;
#        proxy_pass http://백엔드주소;
#        proxy_set_header Host $host;
#        proxy_set_header X-Real-IP $remote_addr;
#        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#        proxy_set_header X-Forwarded-Proto $scheme;
#    }
#
# 5) 적용 및 재시작:
#    sudo nginx -t && sudo systemctl reload nginx
#
# 6) 여전히 413 이면: 앞단에 다른 프록시(또 다른 Nginx, LB)가 있을 수 있음.
#    그 경우 그 프록시에도 client_max_body_size 1000M; 필요.
#
# [참고] "부동산만 실패하고 등기부는 된다" 처럼 보일 수 있는 이유:
#   - 같은 파일이라도 "첫 번째 요청"이 boundary/헤더 때문에 몇 바이트 더 클 수 있음.
#   - 제한이 2m~2.3m 사이면 첫 요청만 413, 다음 요청은 통과할 수 있음.
#   - 확인: 페이지 새로고침 후 "등기부에 먼저" 같은 파일 올려보기. 등기부도 413 나오면
#     → 첫 요청이 더 크게 잡히는 것이고, 해결은 동일하게 client_max_body_size 1000M 적용.
